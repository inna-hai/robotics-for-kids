<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>דף עבודה עצמית | אקדמיית ה-Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/craftom/craftom-challenges.css?v=20260905-agent-steps-2">
  <link rel="stylesheet" href="css/platform-home-link.css">
  <style>
    .worksheet{display:grid;gap:12px}
    .field{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px}
    .field label{display:block;font-weight:900;margin-bottom:6px}
    .line{min-height:42px;border:2px dashed #c7daec;border-radius:10px;background:#f8fcff}
    .line.large{min-height:86px}
    .meeting-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
    .meeting-list li{border:1px solid #cfe2f3;background:#fff;border-radius:12px;padding:10px}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <div class="kicker" id="kicker"></div>
        <h1 id="title"></h1>
        <p class="goal" id="story"></p>
        <div class="actions" id="actions"></div>
      </div>
      <article class="card build-first">
        <h2>איך עובדים לבד?</h2>
        <p>קוראים את המשימה, עובדים במגרש 50x50 האישי, בונים במיינקראפט, כותבים קוד קצר ב-MakeCode, מריצים את ה-Agent, בודקים, מתקנים וכותבים מה השתנה.</p>
      </article>
    </section>
    <section class="grid">
      <article class="card">
        <h2>ארבעת המפגשים</h2>
        <ul class="meeting-list" id="meetings"></ul>
      </article>
      <article class="card">
        <h2>בדיקת הצלחה</h2>
        <ul id="checks"></ul>
      </article>
    </section>
    <section class="card worksheet" style="margin-top:16px">
      <h2>דף עבודה עצמית</h2>
      <div class="field"><label>שם / צוות</label><div class="line"></div></div>
      <div class="field"><label>איזה מפגש אנחנו עושים היום?</label><div class="line"></div></div>
      <div class="field"><label>מה כבר היה בעיר שלי מתחילת הקורס?</label><div class="line large"></div></div>
      <div class="field"><label>מה הוספתי היום לעיר במיינקראפט?</label><div class="line large"></div></div>
      <div class="field"><label>איזו פקודה או קוד מפעילים את זה?</label><div class="line large"></div></div>
      <div class="field"><label>איזה רעיון תכנות השתמשתי בו: רצף, לולאה, משתנה או תנאי?</label><div class="line large"></div></div>
      <div class="field"><label>מה ה-Agent עושה בעולם כשמריצים את הקוד?</label><div class="line large"></div></div>
      <div class="field"><label>מה בדקתי ומה תיקנתי?</label><div class="line large"></div></div>
      <div class="field"><label>העלאת תמונה ל-Craftom: צילום של מה שבניתי ומה שה-Agent עשה</label><div class="line"></div></div>
      <div class="field"><label>הסבר קצר במילים שלי: מה בניתי, מה הקוד עושה, ומה השתנה בעיר?</label><div class="line large"></div></div>
    </section>
  </main>
  <a class="platform-home-link" href="index.html" aria-label="חזרה לעמוד הראשי"><span class="platform-home-icon" aria-hidden="true">🏠</span><span class="platform-home-text">לעמוד הראשי</span></a>
  <script src="js/craftom-minecraft-challenges.js?v=20260905-agent-steps-2"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const program = window.CRAFTOM_MINECRAFT_PROGRAM;
    const challenge = window.getCraftomMinecraftChallenge(params.get('challenge') || params.get('lesson'));
    const esc = value => String(value || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    document.title = `דף עבודה עצמית - ${challenge.title}`;
    document.getElementById('kicker').textContent = `אקדמיית ה-Agent • אתגר ${challenge.id}`;
    document.getElementById('title').textContent = challenge.title;
    document.getElementById('story').textContent = challenge.story;
    document.getElementById('actions').innerHTML = `
      <a class="btn" href="craftom-minecraft-challenge.html?challenge=${challenge.id}">פתחו אתגר</a>
      <a class="btn secondary" href="${esc(challenge.video)}">פתחו סרטון</a>
      <a class="btn secondary" href="craftom-school/preview/index.html">מפת הקורס</a>
    `;
    document.getElementById('meetings').innerHTML = challenge.meetings.map(item => {
      const detail = item[4];
      return `<li><b>${esc(item[0])} ${esc(item[1])}</b><br>${esc(item[2])}<br><span class="muted">תוצר: ${esc(item[3])}</span><br><strong>מה אני בונה:</strong> ${detail.build.map(esc).join(' · ')}<br><strong>מה אני מעלה:</strong> ${esc(program.exitUpload)}<br><strong>מה אני בודק/ת:</strong> ${esc(detail.exit)}</li>`;
    }).join('');
    document.getElementById('checks').innerHTML = challenge.checks.map(item => `<li>${esc(item)}</li>`).join('');
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">NASA JPL EcoFlight battery optimization mission</title>
  <desc id="desc">A grade 8 Drone Mission Lab diagram comparing a wasteful baseline drone route with an optimized EcoFlight route, including three photo stations, Telemetry Bar battery readings, savings formula, and safety roles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.48" stop-color="#7c2d12"/><stop offset="1" stop-color="#365314"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrowOld" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fb7185"/></marker>
    <marker id="arrowNew" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#22c55e"/></marker>
    <style>
      .h1{font:900 42px system-ui,Segoe UI,Arial;fill:#fff}.sub{font:650 19px system-ui,Segoe UI,Arial;fill:#fef3c7}.panel{fill:#ffffffee;stroke:#fde68a;stroke-width:2;rx:30;filter:url(#shadow)}.h2{font:900 26px system-ui,Segoe UI,Arial;fill:#713f12}.txt{font:750 18px system-ui,Segoe UI,Arial;fill:#164e63}.small{font:650 14px system-ui,Segoe UI,Arial;fill:#155e75}.code{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fef3c7}.darkcode{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0f172a}.safe{fill:#ecfeff;stroke:#22c55e;stroke-width:6;stroke-dasharray:16 9}.old{fill:none;stroke:#fb7185;stroke-width:7;stroke-dasharray:13 11;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowOld)}.new{fill:none;stroke:#22c55e;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowNew)}.station{fill:#e0f2fe;stroke:#0284c7;stroke-width:4}.photo{fill:#fef3c7;stroke:#f59e0b;stroke-width:3}.pad{fill:#22c55e;stroke:#f0fdf4;stroke-width:4}.drone{fill:#111827;stroke:#e0f2fe;stroke-width:3}.nose{fill:#fde68a}.batteryBg{fill:#0f172a;stroke:#e5e7eb;stroke-width:3}.batteryGood{fill:#22c55e}.batteryWarn{fill:#f97316}.batteryBad{fill:#ef4444}.role{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.badge{font:900 15px system-ui,Segoe UI,Arial;fill:#082f49}.warn{font:900 15px system-ui,Segoe UI,Arial;fill:#7c2d12}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" class="h1">NASA JPL EcoFlight — Battery‑Saving Flight</text>
  <text x="600" y="90" text-anchor="middle" class="sub">JavaScript optimization · Telemetry Bar · baseline vs optimized · 20% route reduction</text>

  <rect x="55" y="124" width="735" height="505" class="panel"/>
  <text x="422" y="164" text-anchor="middle" class="h2">Safe Fly Zone — optimize the same three photo stations</text>
  <rect x="120" y="205" width="545" height="330" rx="24" class="safe"/>
  <circle cx="210" cy="485" r="23" class="pad"/><text x="210" y="520" text-anchor="middle" class="small">Launch</text>
  <rect x="350" y="420" width="88" height="54" rx="14" class="station"/><text x="394" y="454" text-anchor="middle" class="badge">Photo A</text>
  <rect x="245" y="260" width="88" height="54" rx="14" class="station"/><text x="289" y="294" text-anchor="middle" class="badge">Photo B</text>
  <rect x="545" y="260" width="88" height="54" rx="14" class="station"/><text x="589" y="294" text-anchor="middle" class="badge">Photo C</text>

  <path d="M210 485 L394 447 L289 287 L394 447 L589 287 L394 447 L210 485" class="old"/>
  <path d="M210 485 L394 447 L589 287 L289 287 L210 485" class="new"/>
  <circle cx="394" cy="392" r="18" class="photo"/><text x="394" y="398" text-anchor="middle" font-size="18">📸</text>
  <circle cx="589" cy="237" r="18" class="photo"/><text x="589" y="243" text-anchor="middle" font-size="18">📸</text>
  <circle cx="289" cy="237" r="18" class="photo"/><text x="289" y="243" text-anchor="middle" font-size="18">📸</text>

  <text x="205" y="190" class="txt" fill="#fb7185">Baseline: extra yaw + height changes</text>
  <text x="205" y="565" class="txt" fill="#166534">EcoFlight: direct path, constant safe altitude, lateral moves</text>
  <g transform="translate(210 485)"><rect x="-34" y="-21" width="68" height="42" rx="16" class="drone"/><polygon points="0,-34 14,-18 -14,-18" class="nose"/><circle cx="-21" cy="0" r="7" fill="#67e8f9"/><circle cx="21" cy="0" r="7" fill="#67e8f9"/></g>
  <rect x="140" y="590" width="155" height="42" rx="18" class="role"/><text x="217" y="617" text-anchor="middle" class="badge">Driver + Run</text>
  <rect x="310" y="590" width="170" height="42" rx="18" class="role"/><text x="395" y="617" text-anchor="middle" class="badge">Navigator + Telemetry</text>
  <rect x="495" y="590" width="155" height="42" rx="18" class="role"/><text x="572" y="617" text-anchor="middle" class="badge">Safety + Battery</text>

  <rect x="820" y="124" width="325" height="505" rx="30" fill="#020617" opacity=".9" stroke="#fde68a" stroke-opacity=".58" filter="url(#shadow)"/>
  <text x="982" y="164" text-anchor="middle" fill="#fef3c7" font-size="25" font-family="system-ui" font-weight="900">Meeting9_EcoFlight_JS</text>
  <text x="982" y="203" text-anchor="middle" class="code">load Meeting8 mission</text>
  <text x="982" y="239" text-anchor="middle" class="code">remove idle yaw turns</text>
  <text x="982" y="275" text-anchor="middle" class="code">constantSafeAlt = 80;</text>
  <text x="982" y="311" text-anchor="middle" class="code">use flyRight / flyLeft</text>
  <text x="982" y="347" text-anchor="middle" class="code">keep 3 photos</text>
  <text x="982" y="383" text-anchor="middle" class="code">save optimized version</text>

  <text x="982" y="426" text-anchor="middle" fill="#dbeafe" font-size="20" font-family="system-ui" font-weight="900">Telemetry Bar</text>
  <rect x="875" y="448" width="210" height="34" rx="12" class="batteryBg"/><rect x="883" y="456" width="170" height="18" rx="8" class="batteryGood"/><text x="982" y="472" text-anchor="middle" fill="#fff" font-size="16" font-family="system-ui" font-weight="900">Start 100%</text>
  <rect x="875" y="492" width="210" height="34" rx="12" class="batteryBg"/><rect x="883" y="500" width="115" height="18" rx="8" class="batteryWarn"/><text x="982" y="516" text-anchor="middle" fill="#fff" font-size="16" font-family="system-ui" font-weight="900">Baseline 68%</text>
  <rect x="875" y="536" width="210" height="34" rx="12" class="batteryBg"/><rect x="883" y="544" width="145" height="18" rx="8" class="batteryGood"/><text x="982" y="560" text-anchor="middle" fill="#fff" font-size="16" font-family="system-ui" font-weight="900">Optimized 78%</text>
  <text x="982" y="608" text-anchor="middle" class="code">Savings% = (old-new)/old × 100</text>
</svg>

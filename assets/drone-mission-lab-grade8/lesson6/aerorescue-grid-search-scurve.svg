<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AeroRescue Grid Search S-Curve mission</title>
  <desc id="desc">A grade 8 Drone Mission Lab diagram showing a safe fly zone with a zigzag S-Curve grid search route, survivor cards, scanDist and stepDist variables, and team safety roles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172554"/><stop offset=".48" stop-color="#0f766e"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
    <style>.h1{font:900 42px system-ui,Segoe UI,Arial;fill:#fff}.sub{font:650 19px system-ui,Segoe UI,Arial;fill:#dbeafe}.panel{fill:#ffffffdf;stroke:#bae6fd;stroke-width:2;rx:30;filter:url(#shadow)}.h2{font:900 27px system-ui,Segoe UI,Arial;fill:#083344}.txt{font:750 18px system-ui,Segoe UI,Arial;fill:#155e75}.small{font:650 14px system-ui,Segoe UI,Arial;fill:#155e75}.code{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fef3c7}.darkcode{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#083344}.safe{fill:#ecfeff;stroke:#22c55e;stroke-width:7;stroke-dasharray:18 10}.route{fill:none;stroke:#fbbf24;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.scan{fill:none;stroke:#38bdf8;stroke-width:4;stroke-dasharray:8 8;opacity:.65}.victim{fill:#fee2e2;stroke:#ef4444;stroke-width:4}.pad{fill:#22c55e;stroke:#f0fdf4;stroke-width:4}.drone{fill:#111827;stroke:#e0f2fe;stroke-width:3}.nose{fill:#fde68a}.role{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.badge{font:900 15px system-ui,Segoe UI,Arial;fill:#082f49}.warn{font:900 15px system-ui,Segoe UI,Arial;fill:#7f1d1d}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" class="h1">AeroRescue Grid Search — S‑Curve Scan</text>
  <text x="600" y="90" text-anchor="middle" class="sub">JavaScript · Simulator first · Physical flight only by safety gate · scanDist + stepDist</text>

  <rect x="55" y="124" width="725" height="505" class="panel"/>
  <text x="418" y="164" text-anchor="middle" class="h2">Safe Fly Zone — Search &amp; Rescue Grid</text>
  <rect x="135" y="205" width="515" height="335" rx="24" class="safe"/>
  <line x1="185" y1="280" x2="600" y2="280" class="scan"/><line x1="185" y1="365" x2="600" y2="365" class="scan"/><line x1="185" y1="450" x2="600" y2="450" class="scan"/>
  <path d="M205 485 V280 H565 V365 H205 V450 H565" class="route"/>
  <circle cx="205" cy="485" r="22" class="pad"/><text x="205" y="522" text-anchor="middle" class="small">Launch</text>
  <rect x="260" y="430" width="62" height="46" rx="12" class="victim"/><text x="291" y="459" text-anchor="middle" class="badge">א׳</text>
  <rect x="515" y="343" width="62" height="46" rx="12" class="victim"/><text x="546" y="372" text-anchor="middle" class="badge">ב׳</text>
  <rect x="285" y="258" width="62" height="46" rx="12" class="victim"/><text x="316" y="287" text-anchor="middle" class="badge">ג׳</text>
  <text x="665" y="286" class="darkcode">scanDist = 80</text>
  <text x="666" y="373" class="darkcode">stepDist = 40</text>
  <text x="390" y="565" text-anchor="middle" class="warn">Blind Spots appear when stepDist is too large</text>
  <g transform="translate(205 485)"><rect x="-34" y="-21" width="68" height="42" rx="16" class="drone"/><polygon points="0,-34 14,-18 -14,-18" class="nose"/><circle cx="-21" cy="0" r="7" fill="#67e8f9"/><circle cx="21" cy="0" r="7" fill="#67e8f9"/></g>
  <rect x="150" y="590" width="150" height="42" rx="18" class="role"/><text x="225" y="617" text-anchor="middle" class="badge">Driver + Abort</text>
  <rect x="315" y="590" width="150" height="42" rx="18" class="role"/><text x="390" y="617" text-anchor="middle" class="badge">Navigator + Targets</text>
  <rect x="480" y="590" width="150" height="42" rx="18" class="role"/><text x="555" y="617" text-anchor="middle" class="badge">Safety Observer</text>

  <rect x="820" y="124" width="325" height="505" rx="30" fill="#020617" opacity=".86" stroke="#bae6fd" stroke-opacity=".55" filter="url(#shadow)"/>
  <text x="982" y="164" text-anchor="middle" fill="#dbeafe" font-size="25" font-family="system-ui" font-weight="900">Meeting6_GridSearch_JS</text>
  <text x="982" y="211" text-anchor="middle" class="code">let scanDist = 80;</text>
  <text x="982" y="247" text-anchor="middle" class="code">let stepDist = 40;</text>
  <text x="982" y="286" text-anchor="middle" class="code">tello.takeoff();</text>
  <text x="982" y="322" text-anchor="middle" class="code">tello.sleep(3);</text>
  <text x="982" y="360" text-anchor="middle" class="code">tello.flyForward(scanDist);</text>
  <text x="982" y="396" text-anchor="middle" class="code">tello.flyRight(stepDist);</text>
  <text x="982" y="432" text-anchor="middle" class="code">tello.flyBackward(scanDist);</text>
  <text x="982" y="468" text-anchor="middle" class="code">// bonus: repeat pattern</text>
  <text x="982" y="504" text-anchor="middle" class="code">tello.land();</text>
  <rect x="862" y="544" width="240" height="40" rx="20" fill="#dcfce7"/><text x="982" y="570" text-anchor="middle" class="badge">Meeting6_GridSearch_Success</text>

  <rect x="120" y="660" width="960" height="44" rx="22" fill="#0f172a" opacity=".92"/>
  <text x="600" y="688" text-anchor="middle" class="code">Simulator verifies syntax → Physical scan by approval → Navigator logs survivor cards found → calibrate scanDist / stepDist</text>
</svg>

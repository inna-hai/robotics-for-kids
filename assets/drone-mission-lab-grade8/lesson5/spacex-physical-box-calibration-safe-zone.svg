<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SpaceX physical box calibration safe flight zone</title>
  <desc id="desc">A classroom safe fly zone diagram for grade 8 first physical Tello flight, showing a taped rectangle, 1.5 meter safety distance, team roles, WiFi handshake, battery boxes and abort readiness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".5" stop-color="#1e40af"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
    <style>.h1{font:900 40px system-ui,Segoe UI,Arial;fill:#fff}.sub{font:650 19px system-ui,Segoe UI,Arial;fill:#dbeafe}.panel{fill:#ffffffdf;stroke:#bfdbfe;stroke-width:2;rx:30;filter:url(#shadow)}.h2{font:900 26px system-ui,Segoe UI,Arial;fill:#0f172a}.txt{font:750 18px system-ui,Segoe UI,Arial;fill:#1e3a8a}.small{font:650 14px system-ui,Segoe UI,Arial;fill:#1e40af}.code{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fef3c7}.safe{fill:#dcfce7;stroke:#22c55e;stroke-width:7;stroke-dasharray:18 10}.danger{fill:#fecaca;stroke:#ef4444;stroke-width:4}.route{fill:none;stroke:#fbbf24;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.pad{fill:#22c55e;stroke:#f0fdf4;stroke-width:4}.drone{fill:#111827;stroke:#dbeafe;stroke-width:3}.nose{fill:#fde68a}.role{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.batteryFull{fill:#22c55e}.batteryEmpty{fill:#ef4444}.badge{font:900 15px system-ui,Segoe UI,Arial;fill:#082f49}.warn{font:900 15px system-ui,Segoe UI,Arial;fill:#7f1d1d}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" class="h1">SpaceX Integrated Flight Test — First Physical Box Mission</text>
  <text x="600" y="88" text-anchor="middle" class="sub">Grade 8 Drone Mission Lab · WiFi Handshake · Pre‑Flight Safety Check · Abort Ready</text>

  <rect x="55" y="122" width="720" height="510" class="panel"/>
  <text x="415" y="163" text-anchor="middle" class="h2">Classroom Safe Fly Zone</text>
  <rect x="135" y="205" width="505" height="300" rx="22" class="safe"/>
  <text x="388" y="233" text-anchor="middle" class="txt">מלבן טיסה סטרילי — אין כניסה כשהמנועים מסתובבים</text>
  <circle cx="245" cy="425" r="24" class="pad"/><text x="245" y="464" text-anchor="middle" class="small">Launch Pad</text>
  <path d="M245 425 H500 V260 H245 Z" class="route"/>
  <text x="372" y="255" text-anchor="middle" class="small">Box Mission 60×60in</text>
  <g transform="translate(245 425)"><rect x="-36" y="-22" width="72" height="44" rx="16" class="drone"/><polygon points="0,-36 14,-20 -14,-20" class="nose"/><circle cx="-22" cy="0" r="7" fill="#67e8f9"/><circle cx="22" cy="0" r="7" fill="#67e8f9"/></g>
  <line x1="145" y1="552" x2="635" y2="552" stroke="#fbbf24" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="390" y="578" text-anchor="middle" class="txt">1.5m Safety Distance</text>
  <rect x="160" y="595" width="145" height="52" rx="18" class="role"/><text x="232" y="627" text-anchor="middle" class="badge">Driver + Abort</text>
  <rect x="320" y="595" width="145" height="52" rx="18" class="role"/><text x="392" y="627" text-anchor="middle" class="badge">Navigator + Log</text>
  <rect x="480" y="595" width="145" height="52" rx="18" class="role"/><text x="552" y="627" text-anchor="middle" class="badge">Safety Observer</text>
  <rect x="90" y="510" width="625" height="32" rx="16" class="danger" opacity=".9"/><text x="402" y="531" text-anchor="middle" class="warn">Callout: “צוות X ממריא!” · Goggles on · Hair tied · Prop guards locked</text>

  <rect x="815" y="122" width="330" height="510" rx="30" fill="#020617" opacity=".86" stroke="#bfdbfe" stroke-opacity=".55" filter="url(#shadow)"/>
  <text x="980" y="162" text-anchor="middle" fill="#dbeafe" font-size="25" font-family="system-ui" font-weight="900">Flight Readiness Stack</text>
  <text x="980" y="211" text-anchor="middle" class="code">1. School WiFi</text>
  <text x="980" y="247" text-anchor="middle" class="code">2. Load Meeting4 code</text>
  <text x="980" y="283" text-anchor="middle" class="code">3. TELLO-XXXXXX WiFi</text>
  <text x="980" y="319" text-anchor="middle" class="code">4. Battery visible</text>
  <text x="980" y="355" text-anchor="middle" class="code">5. Pre‑Flight Check</text>
  <text x="980" y="391" text-anchor="middle" class="code">6. Launch Mission</text>
  <text x="980" y="427" text-anchor="middle" class="code">7. Measure drift</text>
  <text x="980" y="463" text-anchor="middle" class="code">8. Calibrate distance/sleep</text>
  <g transform="translate(855 495)"><rect width="110" height="56" rx="18" class="batteryFull"/><text x="55" y="35" text-anchor="middle" fill="#f0fdf4" font-size="17" font-weight="900" font-family="system-ui">100%</text><text x="55" y="78" text-anchor="middle" class="small">Full box</text></g>
  <g transform="translate(998 495)"><rect width="110" height="56" rx="18" class="batteryEmpty"/><text x="55" y="35" text-anchor="middle" fill="#fff1f2" font-size="17" font-weight="900" font-family="system-ui">0%</text><text x="55" y="78" text-anchor="middle" class="small">Empty box</text></g>
  <rect x="860" y="586" width="240" height="34" rx="17" fill="#fecaca"/><text x="980" y="608" text-anchor="middle" class="warn">Never store battery inside drone</text>

  <rect x="112" y="660" width="976" height="44" rx="22" fill="#0f172a" opacity=".92"/>
  <text x="600" y="688" text-anchor="middle" class="code">Meeting5_Physical_Box_Calibrated · Sim‑to‑Reality Gap: measure drift → change distance or sleep → fly only by instructor approval</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Methane LoopScan dynamic square mission with JavaScript loops and variables</title>
  <desc id="desc">A grade 8 Drone Mission Lab visual showing a methane gas leak scan around a city site using let distance and a for loop to fly a square route.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#052e16"/><stop offset=".5" stop-color="#0f766e"/><stop offset="1" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#365314"/><stop offset=".55" stop-color="#78716c"/><stop offset="1" stop-color="#a3a3a3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#facc15"/></marker>
    <style>.h1{font:900 42px system-ui,Segoe UI,Arial;fill:#fff}.sub{font:650 19px system-ui,Segoe UI,Arial;fill:#dcfce7}.panel{fill:#ffffffdf;stroke:#bbf7d0;stroke-width:2;rx:30;filter:url(#shadow)}.h2{font:900 27px system-ui,Segoe UI,Arial;fill:#14532d}.txt{font:750 18px system-ui,Segoe UI,Arial;fill:#166534}.small{font:650 14px system-ui,Segoe UI,Arial;fill:#166534}.code{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fef3c7}.darkcode{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#052e16}.route{fill:none;stroke:#facc15;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.route2{fill:none;stroke:#22c55e;stroke-width:5;stroke-dasharray:10 9}.building{fill:#334155;stroke:#cbd5e1;stroke-width:3}.gas{fill:#86efac;opacity:.32}.hot{fill:#ef4444;opacity:.85}.drone{fill:#111827;stroke:#dcfce7;stroke-width:3}.nose{fill:#fde68a}.badge{font:900 15px system-ui,Segoe UI,Arial;fill:#052e16}.warn{font:900 15px system-ui,Segoe UI,Arial;fill:#7f1d1d}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <path d="M0 578 C160 548 300 610 462 566 S740 520 940 580 1090 620 1200 585 L1200 720 L0 720 Z" fill="url(#ground)" opacity=".95"/>
  <text x="600" y="56" text-anchor="middle" class="h1">Methane LoopScan — JavaScript Loops + Variables</text>
  <text x="600" y="91" text-anchor="middle" class="sub">Drone Mission Lab · Meeting 4 · Minimal Grid → City Simulator · Simulator only</text>

  <rect x="65" y="128" width="650" height="485" class="panel"/>
  <text x="390" y="168" text-anchor="middle" class="h2">Dynamic Square Scan Around Gas Leak</text>
  <rect x="265" y="272" width="185" height="135" rx="14" class="building"/><text x="358" y="346" text-anchor="middle" fill="#e2e8f0" font-size="21" font-family="system-ui" font-weight="900">Waste Site</text>
  <ellipse cx="360" cy="340" rx="205" ry="145" class="gas"/><ellipse cx="392" cy="315" rx="95" ry="65" class="gas"/><circle cx="408" cy="315" r="16" class="hot"/><text x="408" y="291" text-anchor="middle" class="small">CH₄ leak</text>
  <path d="M205 225 H560 V475 H205 Z" class="route"/>
  <path d="M235 255 H530 V445 H235 Z" class="route2"/>
  <text x="382" y="214" text-anchor="middle" class="darkcode">distance = 60 → 100</text>
  <text x="585" y="355" class="darkcode">i++</text>
  <text x="377" y="499" text-anchor="middle" class="darkcode">for (let i = 0; i &lt; 4; i++)</text>
  <g transform="translate(205 225)"><rect x="-34" y="-21" width="68" height="42" rx="16" class="drone"/><polygon points="0,-34 14,-18 -14,-18" class="nose"/><circle cx="-21" cy="0" r="7" fill="#67e8f9"/><circle cx="21" cy="0" r="7" fill="#67e8f9"/></g>
  <rect x="122" y="536" width="535" height="42" rx="21" fill="#dcfce7"/><text x="390" y="563" text-anchor="middle" class="badge">Change one value → the whole scan grows/shrinks safely</text>

  <rect x="755" y="128" width="380" height="485" rx="30" fill="#020617" opacity=".86" stroke="#bbf7d0" stroke-opacity=".55" filter="url(#shadow)"/>
  <text x="945" y="168" text-anchor="middle" fill="#dcfce7" font-size="26" font-family="system-ui" font-weight="900">Meeting4_GasScan_Loops_JS</text>
  <text x="945" y="214" text-anchor="middle" class="code">let distance = 80;</text>
  <text x="945" y="252" text-anchor="middle" class="code">tello.takeoff();</text>
  <text x="945" y="287" text-anchor="middle" class="code">tello.sleep(3);</text>
  <text x="945" y="322" text-anchor="middle" class="code">tello.flyUp(80);</text>
  <text x="945" y="360" text-anchor="middle" class="code">for (let i = 0; i &lt; 4; i++) {</text>
  <text x="945" y="394" text-anchor="middle" class="code">  tello.flyForward(distance);</text>
  <text x="945" y="428" text-anchor="middle" class="code">  tello.sleep(2);</text>
  <text x="945" y="462" text-anchor="middle" class="code">  tello.yawRight(90);</text>
  <text x="945" y="496" text-anchor="middle" class="code">}</text>
  <text x="945" y="531" text-anchor="middle" class="code">tello.land();</text>
  <g transform="translate(803 552)"><rect width="284" height="39" rx="19" fill="#fecaca"/><text x="142" y="25" text-anchor="middle" class="warn">Avoid infinite loops: i &lt; 4 + i++</text></g>

  <rect x="135" y="636" width="930" height="50" rx="25" fill="#0f172a" opacity=".9"/>
  <text x="600" y="667" text-anchor="middle" class="code">Methane_LoopScan_Success · Simulator only · Next meeting: first physical flight safety gate</text>
</svg>

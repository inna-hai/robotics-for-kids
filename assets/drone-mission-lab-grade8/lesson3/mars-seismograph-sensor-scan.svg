<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mars Simulator seismograph sensor scan mission</title>
  <desc id="desc">A grade 8 Drone Mission Lab diagram showing a Mars Simulator 3D route with launchpad, seismograph station A at 60 inches, station B at 100 inches, yawRight 180, return and landing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset=".48" stop-color="#7c2d12"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7f1d1d"/><stop offset=".5" stop-color="#c2410c"/><stop offset="1" stop-color="#fed7aa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#67e8f9"/></marker>
    <style>.h1{font:900 42px system-ui,Segoe UI,Arial;fill:#fff}.sub{font:650 19px system-ui,Segoe UI,Arial;fill:#ffedd5}.panel{fill:#fff7eddd;stroke:#fed7aa;stroke-width:2;rx:30;filter:url(#shadow)}.h2{font:900 27px system-ui,Segoe UI,Arial;fill:#7c2d12}.txt{font:750 18px system-ui,Segoe UI,Arial;fill:#7c2d12}.small{font:650 14px system-ui,Segoe UI,Arial;fill:#9a3412}.code{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fef3c7}.route{fill:none;stroke:#fbbf24;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.return{fill:none;stroke:#67e8f9;stroke-width:6;stroke-dasharray:12 10;stroke-linecap:round;marker-end:url(#arrowCyan)}.grid{stroke:#fdba74;stroke-width:2;stroke-dasharray:8 8;opacity:.7}.rock{fill:#9a3412;stroke:#fed7aa;stroke-width:3}.station{fill:#0f172a;stroke:#bae6fd;stroke-width:4}.pad{fill:#22c55e;stroke:#dcfce7;stroke-width:4}.drone{fill:#111827;stroke:#e0f2fe;stroke-width:3}.nose{fill:#fde68a}.badge{font:900 15px system-ui,Segoe UI,Arial;fill:#431407}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#sky)"/>
  <circle cx="982" cy="103" r="54" fill="#fed7aa" opacity=".9"/>
  <circle cx="1017" cy="91" r="14" fill="#fb923c" opacity=".65"/>
  <path d="M0 575 C145 530 270 612 420 555 S695 510 865 568 1080 623 1200 575 L1200 720 L0 720 Z" fill="url(#soil)" opacity=".96"/>
  <path d="M135 575 l55 -115 l70 115 Z" class="rock" opacity=".9"/><path d="M860 575 l68 -145 l88 145 Z" class="rock" opacity=".9"/><path d="M675 575 l48 -100 l66 100 Z" class="rock" opacity=".72"/>
  <text x="600" y="56" text-anchor="middle" class="h1">NASA JPL — Mars Sensor Scan</text>
  <text x="600" y="91" text-anchor="middle" class="sub">Drone Mission Lab · Mars Simulator · X/Y/Z + Yaw 180° · Cloud Save + Code Review</text>

  <rect x="65" y="130" width="715" height="475" class="panel"/>
  <text x="422" y="170" text-anchor="middle" class="h2">Mars Simulator — 3D Seismograph Route</text>
  <line x1="150" y1="515" x2="720" y2="515" class="grid"/><line x1="150" y1="370" x2="720" y2="370" class="grid"/><line x1="150" y1="250" x2="720" y2="250" class="grid"/>
  <text x="735" y="520" class="small">Launch/Land level</text><text x="735" y="375" class="small">Station A — 60in</text><text x="735" y="255" class="small">Station B — 100in</text>
  <circle cx="170" cy="515" r="20" class="pad"/><text x="170" y="548" text-anchor="middle" class="small">Launchpad</text>
  <circle cx="395" cy="370" r="21" class="station"/><path d="M395 390 v45" stroke="#0f172a" stroke-width="6"/><text x="395" y="350" text-anchor="middle" class="small">Seismograph A</text>
  <circle cx="560" cy="250" r="21" class="station"/><path d="M560 270 v45" stroke="#0f172a" stroke-width="6"/><text x="560" y="230" text-anchor="middle" class="small">Seismograph B</text>
  <circle cx="690" cy="515" r="20" fill="#38bdf8" stroke="#e0f2fe" stroke-width="4"/><text x="690" y="548" text-anchor="middle" class="small">Science Pad</text>
  <path d="M170 495 L170 388 L395 388" class="route"/>
  <path d="M395 370 L395 272 L560 272" class="route"/>
  <path d="M560 272 q55 28 10 78" fill="none" stroke="#fde68a" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="626" y="320" class="small">yawRight(180)</text>
  <path d="M560 292 C650 350 705 430 690 495" class="return"/>
  <g transform="translate(395 388)"><rect x="-36" y="-22" width="72" height="44" rx="16" class="drone"/><polygon points="0,-36 14,-20 -14,-20" class="nose"/><circle cx="-22" cy="0" r="7" fill="#67e8f9"/><circle cx="22" cy="0" r="7" fill="#67e8f9"/></g>
  <rect x="275" y="450" width="230" height="36" rx="18" fill="#fed7aa" opacity=".92"/><text x="390" y="473" text-anchor="middle" class="badge">sleep(5) = data downlink + stabilization</text>

  <rect x="820" y="130" width="325" height="475" rx="30" fill="#020617" opacity=".84" stroke="#fed7aa" stroke-opacity=".6" filter="url(#shadow)"/>
  <text x="982" y="170" text-anchor="middle" fill="#ffedd5" font-size="26" font-family="system-ui" font-weight="900">Mars_Mission_Success</text>
  <text x="982" y="215" text-anchor="middle" class="code">tello.takeoff();</text>
  <text x="982" y="250" text-anchor="middle" class="code">tello.sleep(3);</text>
  <text x="982" y="285" text-anchor="middle" class="code">tello.flyUp(60);</text>
  <text x="982" y="320" text-anchor="middle" class="code">tello.flyForward(120);</text>
  <text x="982" y="355" text-anchor="middle" class="code">tello.sleep(5);</text>
  <text x="982" y="390" text-anchor="middle" class="code">tello.flyUp(40);</text>
  <text x="982" y="425" text-anchor="middle" class="code">tello.flyForward(100);</text>
  <text x="982" y="460" text-anchor="middle" class="code">tello.yawRight(180);</text>
  <text x="982" y="495" text-anchor="middle" class="code">tello.flyDown(60);</text>
  <text x="982" y="530" text-anchor="middle" class="code">tello.land();</text>
  <g transform="translate(858 556)"><rect width="248" height="34" rx="17" fill="#fed7aa"/><text x="124" y="23" text-anchor="middle" class="badge">Save → Share → Code Review</text></g>

  <rect x="125" y="635" width="950" height="50" rx="25" fill="#0f172a" opacity=".9"/>
  <text x="600" y="666" text-anchor="middle" class="code">Mars Simulator only · School WiFi for cloud sync · Project: Mars_Sensor_Scan_v1 → Mars_Mission_Success</text>
</svg>

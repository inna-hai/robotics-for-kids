<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Pix4D city mapper project blueprint prototype</title>
  <desc id="desc">A grade 8 Drone Mission Lab blueprint diagram showing paper planning, three city buildings of different heights, photo points, JavaScript variables, City Simulator prototype, and instructor sign-off.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.5" stop-color="#075985"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bae6fd" stroke-opacity=".28" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
    <style>
      .h1{font:900 42px system-ui,Segoe UI,Arial;fill:#fff}.sub{font:650 19px system-ui,Segoe UI,Arial;fill:#dbeafe}.panel{fill:#ffffffef;stroke:#bae6fd;stroke-width:2;rx:30;filter:url(#shadow)}.h2{font:900 26px system-ui,Segoe UI,Arial;fill:#0c4a6e}.txt{font:750 18px system-ui,Segoe UI,Arial;fill:#164e63}.small{font:650 14px system-ui,Segoe UI,Arial;fill:#155e75}.code{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e0f2fe}.darkcode{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0f172a}.route{fill:none;stroke:#fbbf24;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.planRoute{fill:none;stroke:#0284c7;stroke-width:4;stroke-dasharray:10 8}.building{stroke:#334155;stroke-width:4}.bA{fill:#bfdbfe}.bB{fill:#93c5fd}.bC{fill:#60a5fa}.photo{fill:#fef3c7;stroke:#f59e0b;stroke-width:3}.pad{fill:#22c55e;stroke:#f0fdf4;stroke-width:4}.role{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.badge{font:900 15px system-ui,Segoe UI,Arial;fill:#082f49}.note{fill:#ecfeff;stroke:#22d3ee;stroke-width:2}.warn{font:900 15px system-ui,Segoe UI,Arial;fill:#7c2d12}.check{fill:#22c55e}.paper{fill:#f8fafc;stroke:#cbd5e1;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" class="h1">Pix4D City Mapper — Project Blueprint</text>
  <text x="600" y="90" text-anchor="middle" class="sub">Paper Blueprint first · City Simulator prototype · JavaScript variables + takePhoto · no physical flight today</text>

  <rect x="55" y="124" width="735" height="505" class="panel"/>
  <rect x="95" y="175" width="650" height="405" rx="22" fill="url(#grid)" stroke="#38bdf8" stroke-width="3"/>
  <text x="422" y="164" text-anchor="middle" class="h2">City Simulator — autonomous roof mapping prototype</text>

  <circle cx="180" cy="520" r="24" class="pad"/><text x="180" y="555" text-anchor="middle" class="small">Launch Base</text>
  <rect x="245" y="410" width="112" height="86" rx="12" class="building bA"/><text x="301" y="454" text-anchor="middle" class="badge">Building A</text><text x="301" y="476" text-anchor="middle" class="small">60 in</text>
  <rect x="395" y="300" width="126" height="104" rx="12" class="building bB"/><text x="458" y="350" text-anchor="middle" class="badge">Building B</text><text x="458" y="373" text-anchor="middle" class="small">80 in</text>
  <rect x="575" y="195" width="132" height="136" rx="12" class="building bC"/><text x="641" y="257" text-anchor="middle" class="badge">Building C</text><text x="641" y="281" text-anchor="middle" class="small">120 in</text>

  <path d="M180 520 L301 392 L458 282 L641 172 L690 172" class="route"/>
  <path d="M301 392 H458 V282 H641" class="planRoute"/>
  <circle cx="301" cy="382" r="19" class="photo"/><text x="301" y="388" text-anchor="middle" font-size="18">📸</text><text x="332" y="388" class="small">photo 80</text>
  <circle cx="458" cy="272" r="19" class="photo"/><text x="458" y="278" text-anchor="middle" font-size="18">📸</text><text x="489" y="278" class="small">photo 100</text>
  <circle cx="641" cy="162" r="19" class="photo"/><text x="641" y="168" text-anchor="middle" font-size="18">📸</text><text x="672" y="168" class="small">photo 140</text>
  <text x="375" y="538" text-anchor="middle" class="warn">Tablets face down until the paper route receives instructor sign‑off</text>

  <rect x="120" y="590" width="170" height="42" rx="18" class="role"/><text x="205" y="617" text-anchor="middle" class="badge">System Architect</text>
  <rect x="310" y="590" width="165" height="42" rx="18" class="role"/><text x="392" y="617" text-anchor="middle" class="badge">Lead Coder</text>
  <rect x="495" y="590" width="185" height="42" rx="18" class="role"/><text x="587" y="617" text-anchor="middle" class="badge">Safety Supervisor</text>

  <rect x="820" y="124" width="325" height="505" rx="30" fill="#020617" opacity=".9" stroke="#bae6fd" stroke-opacity=".58" filter="url(#shadow)"/>
  <text x="982" y="164" text-anchor="middle" fill="#e0f2fe" font-size="25" font-family="system-ui" font-weight="900">Meeting10_Project_Blueprint_JS</text>
  <rect x="862" y="190" width="240" height="118" rx="16" class="paper"/>
  <text x="982" y="218" text-anchor="middle" class="darkcode">Paper Blueprint</text>
  <line x1="890" y1="240" x2="1075" y2="240" stroke="#0284c7" stroke-width="3"/><line x1="890" y1="265" x2="1030" y2="265" stroke="#0284c7" stroke-width="3"/><line x1="890" y1="290" x2="1055" y2="290" stroke="#0284c7" stroke-width="3"/>
  <text x="982" y="348" text-anchor="middle" class="code">let scanDist = 100;</text>
  <text x="982" y="384" text-anchor="middle" class="code">let safeAltitude = 120;</text>
  <text x="982" y="420" text-anchor="middle" class="code">let photoDelay = 3;</text>
  <text x="982" y="462" text-anchor="middle" class="code">tello.flyUp(...);</text>
  <text x="982" y="498" text-anchor="middle" class="code">tello.takePhoto();</text>
  <text x="982" y="534" text-anchor="middle" class="code">tello.yawRight(180);</text>
  <text x="982" y="570" text-anchor="middle" class="code">City Simulator only</text>
  <g transform="translate(875 596)"><circle cx="0" cy="0" r="18" class="check"/><path d="M-8 0 L-2 7 L10 -8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="998" y="603" fill="#bbf7d0" font-size="18" font-family="system-ui" font-weight="900">Instructor Sign‑off → code</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Antarctica atmospheric vertical scan mission</title>
  <desc id="desc">A vertical Minimal Grid simulator diagram for grade 8 Drone Mission Lab showing takeoff, flyUp to 60 inches, sleep scan, flyUp to 120 inches, flyDown and land.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a2f"/><stop offset=".55" stop-color="#0e7490"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
    <style>.h1{font:900 42px system-ui,Segoe UI,Arial;fill:#fff}.sub{font:650 19px system-ui,Segoe UI,Arial;fill:#e0f2fe}.h2{font:900 26px system-ui,Segoe UI,Arial;fill:#083344}.txt{font:700 18px system-ui,Segoe UI,Arial;fill:#164e63}.small{font:650 14px system-ui,Segoe UI,Arial;fill:#155e75}.code{font:800 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fef3c7}.panel{fill:#ffffffd9;stroke:#bae6fd;stroke-width:2;rx:30;filter:url(#shadow)}.grid{stroke:#67e8f9;stroke-width:2;stroke-dasharray:8 8;opacity:.65}.route{fill:none;stroke:#fbbf24;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.drone{fill:#0f172a;stroke:#e0f2fe;stroke-width:3}.layer{fill:#22d3ee;opacity:.18;stroke:#0891b2;stroke-width:3}.pad{fill:#22c55e;stroke:#dcfce7;stroke-width:4}.badge{font:900 16px system-ui,Segoe UI,Arial;fill:#082f49}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <path d="M0 605 C150 555 260 625 410 580 S720 520 920 590 1085 638 1200 590 L1200 720 L0 720 Z" fill="url(#ice)" opacity=".95"/>
  <circle cx="1010" cy="105" r="150" fill="#fff" opacity=".16"/>
  <text x="600" y="56" text-anchor="middle" class="h1">Antarctica Atmospheric Scan — JavaScript Mission 1</text>
  <text x="600" y="91" text-anchor="middle" class="sub">Drone Mission Lab · Minimal Grid Simulator · ציר אנכי בלבד · ללא הטסה פיזית</text>

  <rect x="70" y="125" width="690" height="495" class="panel"/>
  <text x="415" y="166" text-anchor="middle" class="h2">Minimal Grid — Vertical Research Profile</text>
  <line x1="210" y1="520" x2="650" y2="520" class="grid"/><line x1="210" y1="350" x2="650" y2="350" class="grid"/><line x1="210" y1="185" x2="650" y2="185" class="grid"/>
  <text x="670" y="525" class="small">Launchpad / Land</text>
  <text x="670" y="355" class="small">Layer A — 60in · sleep(5)</text>
  <text x="670" y="190" class="small">Layer B — 120in · sleep(5)</text>
  <circle cx="300" cy="520" r="22" class="pad"/><text x="300" y="555" text-anchor="middle" class="small">מנחת מוגן</text>
  <path d="M300 500 L300 370" class="route"/><path d="M300 330 L300 205" class="route"/><path d="M330 205 C430 255 455 390 360 492" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
  <g transform="translate(300 345)"><rect x="-38" y="-22" width="76" height="44" rx="18" class="drone"/><circle cx="-24" cy="0" r="7" fill="#67e8f9"/><circle cx="24" cy="0" r="7" fill="#67e8f9"/><path d="M-62 -30 C-28 -54 28 -54 62 -30" stroke="#0f172a" stroke-width="5" fill="none"/><path d="M-62 30 C-28 54 28 54 62 30" stroke="#0f172a" stroke-width="5" fill="none"/></g>
  <rect x="390" y="315" width="220" height="70" rx="18" class="layer"/><text x="500" y="344" text-anchor="middle" class="txt">O₂ + Ice Particles</text><text x="500" y="370" text-anchor="middle" class="small">sensor focus: sleep(5)</text>
  <rect x="390" y="150" width="220" height="70" rx="18" class="layer"/><text x="500" y="179" text-anchor="middle" class="txt">Upper Atmosphere</text><text x="500" y="205" text-anchor="middle" class="small">second scan point</text>

  <rect x="805" y="126" width="330" height="494" rx="30" fill="#020617" opacity=".82" stroke="#e0f2fe" stroke-opacity=".4" filter="url(#shadow)"/>
  <text x="970" y="166" text-anchor="middle" fill="#e0f2fe" font-size="26" font-family="system-ui" font-weight="900">JS Flight Plan</text>
  <text x="970" y="215" text-anchor="middle" class="code">tello.takeoff();</text>
  <text x="970" y="255" text-anchor="middle" class="code">tello.sleep(3);</text>
  <text x="970" y="295" text-anchor="middle" class="code">tello.flyUp(60);</text>
  <text x="970" y="335" text-anchor="middle" class="code">tello.sleep(5);</text>
  <text x="970" y="375" text-anchor="middle" class="code">tello.flyUp(60);</text>
  <text x="970" y="415" text-anchor="middle" class="code">tello.sleep(5);</text>
  <text x="970" y="455" text-anchor="middle" class="code">tello.flyDown(80);</text>
  <text x="970" y="495" text-anchor="middle" class="code">tello.land();</text>
  <g transform="translate(845 535)"><rect width="250" height="42" rx="21" fill="#bae6fd"/><text x="125" y="28" text-anchor="middle" class="badge">Simulator only · No TELLO WiFi</text></g>

  <rect x="160" y="650" width="880" height="44" rx="22" fill="#0f172a" opacity=".88"/>
  <text x="600" y="678" text-anchor="middle" class="code">Save → Share Link: Meeting1_Atmospheric_Scan_JS | Syntax is not a suggestion — it is flight structure.</text>
</svg>

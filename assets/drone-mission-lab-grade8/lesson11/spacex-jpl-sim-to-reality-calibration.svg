<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SpaceX NASA JPL sim to reality calibration flight testing</title>
  <desc id="desc">A grade 8 Drone Mission Lab physical calibration diagram showing Safe Fly Zone, three building stations at different heights, drift between planned and real paths, scanDist safeAltitude photoDelay variables, photo offloading, and team roles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="0.48" stop-color="#1e3a8a"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="plannedArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/></marker>
    <marker id="realArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
    <style>
      .h1{font:900 42px system-ui,Segoe UI,Arial;fill:#fff}.sub{font:650 19px system-ui,Segoe UI,Arial;fill:#dbeafe}.panel{fill:#ffffffee;stroke:#bae6fd;stroke-width:2;rx:30;filter:url(#shadow)}.h2{font:900 26px system-ui,Segoe UI,Arial;fill:#1e3a8a}.txt{font:750 18px system-ui,Segoe UI,Arial;fill:#164e63}.small{font:650 14px system-ui,Segoe UI,Arial;fill:#155e75}.code{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e0f2fe}.darkcode{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0f172a}.safe{fill:#ecfeff;stroke:#22c55e;stroke-width:7;stroke-dasharray:18 10}.planned{fill:none;stroke:#38bdf8;stroke-width:6;stroke-dasharray:12 10;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#plannedArrow)}.real{fill:none;stroke:#fbbf24;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#realArrow)}.drift{fill:none;stroke:#ef4444;stroke-width:4;stroke-dasharray:6 6}.station{stroke:#334155;stroke-width:4}.a{fill:#bfdbfe}.b{fill:#fed7aa}.c{fill:#ddd6fe}.card{fill:#fff1f2;stroke:#ef4444;stroke-width:4}.photo{fill:#fef3c7;stroke:#f59e0b;stroke-width:3}.pad{fill:#22c55e;stroke:#f0fdf4;stroke-width:4}.role{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.badge{font:900 15px system-ui,Segoe UI,Arial;fill:#082f49}.warn{font:900 15px system-ui,Segoe UI,Arial;fill:#7f1d1d}.battery{fill:#0f172a;stroke:#e5e7eb;stroke-width:3}.green{fill:#22c55e}.orange{fill:#f97316}
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" class="h1">SpaceX × NASA JPL — Launchpad Flight Testing</text>
  <text x="600" y="90" text-anchor="middle" class="sub">Simulation‑to‑Reality Gap · Visual Calibration · scanDist + safeAltitude + photoDelay · physical safety gate</text>

  <rect x="55" y="124" width="735" height="505" class="panel"/>
  <text x="422" y="164" text-anchor="middle" class="h2">Safe Fly Zone — calibrate the project prototype in reality</text>
  <rect x="120" y="205" width="545" height="335" rx="24" class="safe"/>
  <circle cx="190" cy="500" r="24" class="pad"/><text x="190" y="535" text-anchor="middle" class="small">Launchpad</text>

  <rect x="250" y="420" width="96" height="62" rx="12" class="station a"/><text x="298" y="452" text-anchor="middle" class="badge">Station A</text><text x="298" y="474" text-anchor="middle" class="small">80 cm</text>
  <rect x="390" y="330" width="96" height="48" rx="12" class="station b"/><text x="438" y="357" text-anchor="middle" class="badge">Station B</text><text x="438" y="375" text-anchor="middle" class="small">50 cm</text>
  <rect x="545" y="215" width="104" height="92" rx="12" class="station c"/><text x="597" y="260" text-anchor="middle" class="badge">Station C</text><text x="597" y="284" text-anchor="middle" class="small">120 cm</text>
  <rect x="266" y="386" width="64" height="34" rx="8" class="card"/><text x="298" y="409" text-anchor="middle" font-size="22" font-family="system-ui" font-weight="900" fill="#dc2626">A</text>
  <rect x="406" y="296" width="64" height="34" rx="8" class="card"/><text x="438" y="319" text-anchor="middle" font-size="22" font-family="system-ui" font-weight="900" fill="#dc2626">B</text>
  <rect x="565" y="181" width="64" height="34" rx="8" class="card"/><text x="597" y="204" text-anchor="middle" font-size="22" font-family="system-ui" font-weight="900" fill="#dc2626">C</text>

  <path d="M190 500 L298 382 L438 292 L597 177" class="planned"/>
  <path d="M190 500 L322 398 L465 314 L618 205" class="real"/>
  <path d="M298 382 L322 398 M438 292 L465 314 M597 177 L618 205" class="drift"/>
  <text x="360" y="225" class="txt">planned path</text><text x="500" y="355" class="warn">real drift: measure cm → adjust variables</text>
  <circle cx="322" cy="368" r="18" class="photo"/><text x="322" y="374" text-anchor="middle" font-size="18">📸</text>
  <circle cx="465" cy="284" r="18" class="photo"/><text x="465" y="290" text-anchor="middle" font-size="18">📸</text>
  <circle cx="618" cy="175" r="18" class="photo"/><text x="618" y="181" text-anchor="middle" font-size="18">📸</text>

  <text x="390" y="565" text-anchor="middle" class="warn">Photo Offloading: sharp? cropped? black? blurry? → calibrate one variable at a time</text>
  <rect x="120" y="590" width="150" height="42" rx="18" class="role"/><text x="195" y="617" text-anchor="middle" class="badge">Driver + Abort</text>
  <rect x="292" y="590" width="190" height="42" rx="18" class="role"/><text x="387" y="617" text-anchor="middle" class="badge">Navigator + Drift Log</text>
  <rect x="505" y="590" width="165" height="42" rx="18" class="role"/><text x="587" y="617" text-anchor="middle" class="badge">Safety Observer</text>

  <rect x="820" y="124" width="325" height="505" rx="30" fill="#020617" opacity=".9" stroke="#bae6fd" stroke-opacity=".58" filter="url(#shadow)"/>
  <text x="982" y="164" text-anchor="middle" fill="#e0f2fe" font-size="24" font-family="system-ui" font-weight="900">Meeting11_Project_Calibration_JS</text>
  <text x="982" y="207" text-anchor="middle" class="code">load Meeting10 blueprint</text>
  <text x="982" y="246" text-anchor="middle" class="code">let scanDist = 100 → 120;</text>
  <text x="982" y="285" text-anchor="middle" class="code">let safeAltitude = 120;</text>
  <text x="982" y="324" text-anchor="middle" class="code">let photoDelay = 2 → 4;</text>
  <text x="982" y="363" text-anchor="middle" class="code">tello.sleep(photoDelay);</text>
  <text x="982" y="402" text-anchor="middle" class="code">tello.takePhoto();</text>
  <text x="982" y="441" text-anchor="middle" class="code">Photo Offloading → Gallery</text>
  <rect x="875" y="474" width="210" height="34" rx="12" class="battery"/><rect x="883" y="482" width="145" height="18" rx="8" class="green"/><text x="982" y="498" text-anchor="middle" fill="#fff" font-size="16" font-family="system-ui" font-weight="900">battery window</text>
  <rect x="875" y="520" width="210" height="34" rx="12" class="battery"/><rect x="883" y="528" width="92" height="18" rx="8" class="orange"/><text x="982" y="544" text-anchor="middle" fill="#fff" font-size="16" font-family="system-ui" font-weight="900">land + swap battery</text>
  <text x="982" y="590" text-anchor="middle" fill="#bbf7d0" font-size="18" font-family="system-ui" font-weight="900">Final: Meeting11_Project_Calibrated_Success</text>
</svg>

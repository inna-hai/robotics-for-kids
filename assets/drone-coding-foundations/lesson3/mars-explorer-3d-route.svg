<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
<title id="title">Mars Explorer 3D route</title><desc id="desc">Mars simulator mission with solar panels at 90 inches, seismograph at 50 inches, sleep pauses and return home.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset=".55" stop-color="#7c2d12"/><stop offset="1" stop-color="#fed7aa"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#22d3ee"/></marker><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#431407" flood-opacity=".25"/></filter></defs>
<rect width="1080" height="640" rx="34" fill="url(#bg)"/><circle cx="125" cy="92" r="38" fill="#fef3c7"/><g fill="#e0f2fe"><circle cx="850" cy="90" r="3"/><circle cx="760" cy="140" r="2"/><circle cx="930" cy="155" r="2.5"/></g>
<path d="M0 505 C145 450 260 500 395 460 C540 418 690 490 820 440 C940 395 1010 430 1080 405 L1080 640 L0 640 Z" fill="#c2410c"/><path d="M0 560 C180 520 310 585 500 535 C675 488 790 570 1080 505 L1080 640 L0 640 Z" fill="#9a3412" opacity=".8"/>
<text x="540" y="58" text-anchor="middle" font-family="Rubik,Arial" font-size="31" font-weight="900" fill="#fff7ed">Mars Explorer · ענן ומשימת חקר תלת־ממדית</text><text x="540" y="92" text-anchor="middle" font-family="Rubik,Arial" font-size="18" font-weight="800" fill="#e0f2fe">DroneBlocks Code · Mars Simulator · Save Mission / Share Link</text>
<g font-family="Rubik,Arial" font-weight="900" filter="url(#sh)">
  <rect x="105" y="440" width="145" height="70" rx="20" fill="#fff7ed"/><text x="177" y="469" text-anchor="middle" font-size="17" fill="#7c2d12">תחנה 1</text><text x="177" y="492" text-anchor="middle" font-size="15" fill="#334155">Takeoff + 60״</text>
  <rect x="390" y="185" width="190" height="72" rx="20" fill="#ecfeff"/><text x="485" y="214" text-anchor="middle" font-size="17" fill="#0e7490">תחנה 2: פאנלים</text><text x="485" y="238" text-anchor="middle" font-size="15" fill="#334155">90״ + Yaw 90°</text>
  <rect x="675" y="310" width="185" height="72" rx="20" fill="#fef3c7"/><text x="767" y="339" text-anchor="middle" font-size="17" fill="#92400e">תחנה 3: סייסמוגרף</text><text x="767" y="363" text-anchor="middle" font-size="15" fill="#334155">50״ + sleep(3)</text>
  <rect x="830" y="468" width="145" height="70" rx="20" fill="#dcfce7"/><text x="902" y="498" text-anchor="middle" font-size="17" fill="#166534">Home Land</text>
</g>
<path d="M245 445 C330 390 360 300 425 250" fill="none" stroke="#22d3ee" stroke-width="8" stroke-dasharray="14 9" marker-end="url(#arr)"/><path d="M580 235 C650 250 660 295 700 325" fill="none" stroke="#22d3ee" stroke-width="8" marker-end="url(#arr)"/><path d="M860 360 C930 385 945 430 905 468" fill="none" stroke="#22d3ee" stroke-width="8" marker-end="url(#arr)"/>
<g font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#e0f2fe"><rect x="96" y="108" width="330" height="180" rx="22" fill="#0f172a" opacity=".94"/><text x="122" y="145">tello.takeoff();</text><text x="122" y="172">tello.flyUp(60);</text><text x="122" y="199">tello.sleep(2);</text><text x="122" y="226">tello.moveForward(50);</text><text x="122" y="253">tello.flyUp(30);</text></g>
<g font-family="Rubik,Arial" font-weight="900"><rect x="642" y="118" width="342" height="120" rx="22" fill="#ffffff" opacity=".92"/><text x="813" y="154" text-anchor="middle" font-size="21" fill="#7c2d12">למה sleep?</text><text x="813" y="184" text-anchor="middle" font-size="16" fill="#334155">השהייה נותנת ל״חיישנים״ זמן להתייצב</text><text x="813" y="210" text-anchor="middle" font-size="16" fill="#334155">ומדמה תקשורת/מדידה במאדים</text></g>
</svg>

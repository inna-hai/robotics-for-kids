<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ingenuity if else survival route</title>
  <desc id="desc">A Mars canyon decision route diagram showing an if else condition: if storm is active fly right to emergency landing, else fly forward to survey route.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0b18"/><stop offset=".55" stop-color="#5b1b2a"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/></marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
    <style>.h1{font:900 42px system-ui,Segoe UI,Arial;fill:#fff}.h2{font:850 27px system-ui,Segoe UI,Arial;fill:#ffedd5}.txt{font:650 19px system-ui,Segoe UI,Arial;fill:#fed7aa}.small{font:650 15px system-ui,Segoe UI,Arial;fill:#fde68a}.code{font:800 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fef3c7}.panel{fill:url(#panel);stroke:#ffffff35;stroke-width:2;rx:30;filter:url(#shadow)}.safe{fill:#064e3b;stroke:#34d399;stroke-width:5;stroke-dasharray:15 9}.routeF{fill:none;stroke:#38bdf8;stroke-width:7;stroke-linecap:round;marker-end:url(#arrowBlue)}.routeT{fill:none;stroke:#fbbf24;stroke-width:7;stroke-linecap:round;marker-end:url(#arrowYellow)}.node{fill:#f97316;stroke:#ffedd5;stroke-width:4}.em{fill:#22c55e;stroke:#dcfce7;stroke-width:4}.scan{fill:#38bdf8;stroke:#e0f2fe;stroke-width:4}.diamond{fill:#111827;stroke:#fbbf24;stroke-width:5}.chip{font:900 18px system-ui,Segoe UI,Arial;fill:#431407}.label{font:850 18px system-ui,Segoe UI,Arial;fill:#fff}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <path d="M0 610 C160 540 270 650 420 590 S710 520 890 590 1070 660 1200 595 L1200 720 L0 720 Z" fill="#431407" opacity=".8"/>
  <circle cx="1010" cy="110" r="140" fill="#fb923c" opacity=".18"/><circle cx="1038" cy="95" r="60" fill="#fdba74" opacity=".17"/>
  <text x="600" y="56" text-anchor="middle" class="h1">Ingenuity Survival Logic — If / Else</text>
  <text x="600" y="91" text-anchor="middle" class="txt">הרחפן בוחר נתיב לפי תנאי: סערה פעילה? מנחת חירום. אין סערה? ממשיכים בסריקה.</text>

  <rect x="55" y="126" width="1090" height="430" class="panel"/>
  <rect x="125" y="235" width="895" height="230" rx="26" class="safe" opacity=".86"/>
  <text x="572" y="220" text-anchor="middle" class="small">אזור טיסה סטרילי / סימולטור City → בדיקה פיזית קצרה רק באישור מדריך</text>

  <circle cx="190" cy="382" r="20" class="node"/><text x="190" y="418" text-anchor="middle" class="small">מנחת המראה</text>
  <polygon points="456,318 535,382 456,446 377,382" class="diamond"/><text x="456" y="374" text-anchor="middle" class="label">isStorm</text><text x="456" y="397" text-anchor="middle" class="label">Active?</text>
  <circle cx="730" cy="382" r="21" class="scan"/><text x="730" y="418" text-anchor="middle" class="small">סריקה רגילה</text>
  <circle cx="456" cy="258" r="21" class="em"/><text x="456" y="292" text-anchor="middle" class="small">מנחת חירום</text>

  <path d="M214 382 L363 382" class="routeF"/>
  <path d="M535 382 L700 382" class="routeF"/>
  <path d="M456 318 L456 282" class="routeT"/>
  <text x="620" y="358" text-anchor="middle" class="small">else → forward 80in</text>
  <text x="548" y="295" text-anchor="start" class="small">true → right 60in + land</text>

  <g transform="translate(820 260)"><rect width="240" height="165" rx="22" fill="#020617" opacity=".78"/><text x="120" y="34" text-anchor="middle" class="code">let isStormActive</text><text x="120" y="62" text-anchor="middle" class="code">= true;</text><text x="120" y="98" text-anchor="middle" class="code">if (...) { right }</text><text x="120" y="126" text-anchor="middle" class="code">else { forward }</text><text x="120" y="151" text-anchor="middle" class="small">משנים רק משתנה בראש הקוד</text></g>

  <rect x="136" y="592" width="928" height="86" rx="28" fill="#020617" opacity=".78" stroke="#fbbf24" stroke-opacity=".45"/>
  <text x="600" y="626" text-anchor="middle" class="code">if (isStormActive == true) { tello.moveRight(60); tello.land(); } else { tello.moveForward(80); tello.land(); }</text>
  <text x="600" y="657" text-anchor="middle" class="small">Flow Control: לא מריצים את שני הנתיבים — רק הענף שהתנאי שלו נכון.</text>
</svg>

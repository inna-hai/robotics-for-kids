<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-labelledby="title desc">
<title id="title">Skydio blocks to JavaScript bridge</title><desc id="desc">Bridge from block-based logic to DroneBlocks Code JavaScript, showing syntax parts and a textual box mission.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#0f172a" flood-opacity=".18"/></filter><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0ea5e9"/></marker></defs>
<rect width="1080" height="640" rx="34" fill="url(#bg)"/><text x="540" y="58" text-anchor="middle" font-family="Rubik,Arial" font-size="32" font-weight="900" fill="#0f172a">Skydio Autonomy · מעבר מבלוקים ל־JavaScript</text><text x="540" y="92" text-anchor="middle" font-family="Rubik,Arial" font-size="18" font-weight="800" fill="#334155">Object.Action(argument); · Function Reference · Box Mission טקסטואלי</text>
<g transform="translate(75 135)" filter="url(#sh)"><rect width="390" height="390" rx="26" fill="#fff" stroke="#c7d2fe" stroke-width="4"/><text x="195" y="42" text-anchor="middle" font-family="Rubik,Arial" font-size="24" font-weight="900" fill="#3730a3">בלוקים: לוגיקה חזותית</text><g font-family="Rubik,Arial" font-weight="900" font-size="18"><rect x="70" y="85" width="245" height="52" rx="18" fill="#f97316"/><text x="192" y="118" text-anchor="middle" fill="#fff7ed">Takeoff</text><rect x="70" y="155" width="245" height="52" rx="18" fill="#0ea5e9"/><text x="192" y="188" text-anchor="middle" fill="#ecfeff">Move Forward 60</text><rect x="70" y="225" width="245" height="52" rx="18" fill="#22c55e"/><text x="192" y="258" text-anchor="middle" fill="#ecfdf5">Turn Right 90</text><rect x="70" y="295" width="245" height="52" rx="18" fill="#64748b"/><text x="192" y="328" text-anchor="middle" fill="#f8fafc">Land</text></g></g>
<path d="M488 330 L585 330" stroke="#0ea5e9" stroke-width="10" marker-end="url(#arr)"/>
<g transform="translate(615 135)" filter="url(#sh)"><rect width="390" height="390" rx="26" fill="#0f172a"/><text x="195" y="42" text-anchor="middle" font-family="Rubik,Arial" font-size="24" font-weight="900" fill="#fef3c7">JavaScript: קוד מקצועי</text><g font-family="ui-monospace,Consolas,monospace" font-size="18" fill="#e0f2fe"><text x="36" y="92">// Greenhouse box mission</text><text x="36" y="132">tello.takeoff();</text><text x="36" y="172">tello.sleep(3);</text><text x="36" y="212">tello.moveForward(60);</text><text x="36" y="252">tello.sleep(3);</text><text x="36" y="292">tello.yawRight(90);</text><text x="36" y="332">tello.land();</text></g><rect x="32" y="352" width="326" height="25" rx="12" fill="#ecfeff"/><text x="195" y="371" text-anchor="middle" font-family="Rubik,Arial" font-size="13" font-weight="900" fill="#0e7490">tello . action ( argument ) ;</text></g>
<g font-family="Rubik,Arial" font-weight="900"><rect x="175" y="565" width="730" height="42" rx="21" fill="#3730a3"/><text x="540" y="592" text-anchor="middle" font-size="17" fill="#eef2ff">הבלוקים לימדו לוגיקה — JavaScript דורש דיוק הנדסי בכל תו</text></g>

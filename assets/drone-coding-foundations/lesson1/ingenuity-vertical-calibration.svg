<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Ingenuity vertical calibration mission</title>
  <desc id="desc">A Mars themed vertical flight profile for DroneBlocks Code: takeoff, fly up 60 inches, hover, fly up 100 inches, fly down 50 inches, land.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#431407" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="980" height="620" rx="34" fill="url(#sky)"/>
  <circle cx="120" cy="105" r="34" fill="#fef3c7" opacity="0.9"/>
  <circle cx="770" cy="88" r="3" fill="#e0f2fe"/><circle cx="820" cy="150" r="2" fill="#e0f2fe"/><circle cx="680" cy="120" r="2.5" fill="#e0f2fe"/>
  <path d="M0 470 C120 420 220 458 330 430 C470 392 612 452 740 414 C840 382 920 410 980 388 L980 620 L0 620 Z" fill="#c2410c"/>
  <path d="M0 540 C180 500 300 555 470 514 C610 482 760 530 980 486 L980 620 L0 620 Z" fill="#9a3412" opacity="0.8"/>
  <g transform="translate(120 465)" filter="url(#shadow)">
    <ellipse cx="0" cy="45" rx="86" ry="18" fill="#7c2d12" opacity="0.35"/>
    <rect x="-85" y="0" width="170" height="48" rx="18" fill="#f97316"/>
    <rect x="-64" y="12" width="128" height="24" rx="12" fill="#fff7ed"/>
    <text x="0" y="30" text-anchor="middle" font-family="Rubik,Arial" font-weight="900" font-size="16" fill="#7c2d12">Mars Helipad</text>
  </g>
  <line x1="220" y1="480" x2="220" y2="152" stroke="#e0f2fe" stroke-width="5" stroke-dasharray="12 10" opacity="0.8"/>
  <line x1="220" y1="480" x2="220" y2="310" stroke="#22d3ee" stroke-width="8" marker-end="url(#arrow)"/>
  <line x1="220" y1="310" x2="220" y2="190" stroke="#22d3ee" stroke-width="8" marker-end="url(#arrow)"/>
  <line x1="260" y1="190" x2="260" y2="305" stroke="#fb7185" stroke-width="8" marker-end="url(#arrow)"/>
  <g font-family="Rubik,Arial" font-weight="900">
    <rect x="300" y="150" width="265" height="70" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="3"/>
    <text x="432" y="180" text-anchor="middle" font-size="20" fill="#0e7490">גובה שיא: 100 אינץ׳</text>
    <text x="432" y="205" text-anchor="middle" font-size="15" fill="#334155">tello.flyUp(100); + sleep(3)</text>
    <rect x="300" y="285" width="265" height="70" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="432" y="315" text-anchor="middle" font-size="20" fill="#9a3412">גובה ביניים: 50 אינץ׳</text>
    <text x="432" y="340" text-anchor="middle" font-size="15" fill="#334155">tello.flyDown(50); + sleep(5)</text>
    <rect x="605" y="395" width="300" height="128" rx="22" fill="#0f172a" opacity="0.92"/>
    <text x="755" y="430" text-anchor="middle" font-size="22" fill="#fef3c7">JavaScript Flight Plan</text>
    <text x="635" y="462" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#e0f2fe">tello.takeoff();</text>
    <text x="635" y="486" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#e0f2fe">tello.flyUp(60);</text>
    <text x="635" y="510" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#e0f2fe">tello.sleep(5);</text>
  </g>
  <g transform="translate(220 150)" filter="url(#shadow)">
    <ellipse cx="0" cy="74" rx="40" ry="10" fill="#0f172a" opacity="0.25"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="-38" x2="0" y2="38" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="24" fill="#f97316" stroke="#fff7ed" stroke-width="5"/>
    <ellipse cx="-58" cy="0" rx="36" ry="10" fill="#bae6fd" opacity="0.9"/>
    <ellipse cx="58" cy="0" rx="36" ry="10" fill="#bae6fd" opacity="0.9"/>
    <ellipse cx="0" cy="-45" rx="10" ry="34" fill="#bae6fd" opacity="0.9"/>
    <ellipse cx="0" cy="45" rx="10" ry="34" fill="#bae6fd" opacity="0.9"/>
  </g>
  <text x="490" y="60" text-anchor="middle" font-family="Rubik,Arial" font-size="30" font-weight="900" fill="#fff7ed">Ingenuity Mission 1 · Vertical Calibration</text>
  <text x="490" y="96" text-anchor="middle" font-family="Rubik,Arial" font-size="18" font-weight="800" fill="#e0f2fe">Minimal Grid Simulator · No physical flight · Syntax accuracy required</text>
</svg>

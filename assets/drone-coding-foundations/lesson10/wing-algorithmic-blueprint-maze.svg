<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Wing algorithmic blueprint maze</title>
  <desc id="desc">A city simulator blueprint diagram for a grade 7 drone coding lesson showing a pharmacy launch point, no fly zone, building scan, high building bypass, variables, function and if else architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06132e"/><stop offset=".55" stop-color="#123a68"/><stop offset="1" stop-color="#0f513f"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0284c7"/></marker>
    <style>.h1{font:900 42px system-ui,Segoe UI,Arial;fill:#fff}.sub{font:650 19px system-ui,Segoe UI,Arial;fill:#dbeafe}.h2{font:900 25px system-ui,Segoe UI,Arial;fill:#0f172a}.txt{font:700 17px system-ui,Segoe UI,Arial;fill:#1e293b}.small{font:650 14px system-ui,Segoe UI,Arial;fill:#334155}.code{font:800 17px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#fef3c7}.paper{fill:url(#paper);stroke:#bae6fd;stroke-width:2;rx:28;filter:url(#shadow)}.grid{stroke:#93c5fd;stroke-width:1;opacity:.45}.route{fill:none;stroke:#0284c7;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.nofly{fill:#fecaca;stroke:#ef4444;stroke-width:4;stroke-dasharray:12 8}.building{fill:#bfdbfe;stroke:#2563eb;stroke-width:4}.high{fill:#ddd6fe;stroke:#7c3aed;stroke-width:4}.launch{fill:#22c55e;stroke:#dcfce7;stroke-width:4}.land{fill:#fbbf24;stroke:#fef3c7;stroke-width:4}.diamond{fill:#111827;stroke:#f59e0b;stroke-width:4}.chip{font:900 16px system-ui,Segoe UI,Arial;fill:#042f2e}</style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1020" cy="110" r="160" fill="#38bdf8" opacity=".13"/><circle cx="180" cy="630" r="200" fill="#22c55e" opacity=".11"/>
  <text x="600" y="56" text-anchor="middle" class="h1">Wing Algorithmic Blueprint — Final Project Planning</text>
  <text x="600" y="91" text-anchor="middle" class="sub">לפני קוד ולפני רחפן פיזי: מפרקים בעיה, מגדירים משתנים, פונקציות ותנאים, ואז בונים אב־טיפוס בסימולטור City.</text>

  <rect x="62" y="125" width="685" height="505" class="paper"/>
  <g>
    <path d="M100 170 H710 M100 220 H710 M100 270 H710 M100 320 H710 M100 370 H710 M100 420 H710 M100 470 H710 M100 520 H710 M100 570 H710" class="grid"/>
    <path d="M110 150 V595 M160 150 V595 M210 150 V595 M260 150 V595 M310 150 V595 M360 150 V595 M410 150 V595 M460 150 V595 M510 150 V595 M560 150 V595 M610 150 V595 M660 150 V595 M710 150 V595" class="grid"/>
  </g>
  <text x="405" y="165" text-anchor="middle" class="h2">City Maze Blueprint</text>
  <circle cx="165" cy="545" r="22" class="launch"/><text x="165" y="585" text-anchor="middle" class="small">בית מרקחת / Takeoff</text>
  <rect x="245" y="210" width="180" height="85" rx="16" class="nofly"/><text x="335" y="258" text-anchor="middle" class="txt">No‑Fly Zone</text>
  <rect x="300" y="382" width="115" height="95" rx="10" class="building"/><text x="358" y="435" text-anchor="middle" class="txt">בניין א׳</text><text x="358" y="459" text-anchor="middle" class="small">80in · scan</text>
  <rect x="530" y="258" width="125" height="170" rx="10" class="high"/><text x="592" y="338" text-anchor="middle" class="txt">בניין ב׳</text><text x="592" y="362" text-anchor="middle" class="small">120in · over</text>
  <circle cx="642" cy="548" r="23" class="land"/><text x="642" y="588" text-anchor="middle" class="small">Final Landing</text>
  <polygon points="470,405 515,440 470,475 425,440" class="diamond"/><text x="470" y="435" text-anchor="middle" fill="#fff" font-size="14" font-family="system-ui" font-weight="800">height</text><text x="470" y="454" text-anchor="middle" fill="#fff" font-size="14" font-family="system-ui" font-weight="800">&lt;100?</text>
  <path d="M165 520 C170 410 205 330 245 296 C268 274 290 263 314 260" class="route"/>
  <path d="M335 296 C320 350 315 375 358 382" class="route"/>
  <path d="M415 430 L425 440" class="route"/>
  <path d="M515 440 C555 445 580 430 592 428" class="route"/>
  <path d="M592 428 C655 475 690 515 642 548" class="route"/>

  <rect x="790" y="128" width="350" height="502" rx="28" fill="#020617" opacity=".82" stroke="#38bdf8" stroke-opacity=".38" filter="url(#shadow)"/>
  <text x="965" y="170" text-anchor="middle" fill="#e0f2fe" font-size="26" font-family="system-ui" font-weight="900">Architecture Checklist</text>
  <g transform="translate(824 205)"><rect width="282" height="42" rx="21" fill="#34d399"/><text x="141" y="27" text-anchor="middle" class="chip">1. Variables</text></g>
  <text x="965" y="276" text-anchor="middle" class="code">safeAltitude = 120</text>
  <text x="965" y="305" text-anchor="middle" class="code">scanDistance = 60</text>
  <text x="965" y="334" text-anchor="middle" class="code">obstacleHeight = 80</text>
  <g transform="translate(824 365)"><rect width="282" height="42" rx="21" fill="#60a5fa"/><text x="141" y="27" text-anchor="middle" class="chip">2. Function</text></g>
  <text x="965" y="438" text-anchor="middle" class="code">scanBuilding(sides, distance)</text>
  <text x="965" y="467" text-anchor="middle" class="code">for (...) { yawRight(90); }</text>
  <g transform="translate(824 498)"><rect width="282" height="42" rx="21" fill="#fbbf24"/><text x="141" y="27" text-anchor="middle" class="chip">3. If / Else</text></g>
  <text x="965" y="571" text-anchor="middle" class="code">if height &lt; 100 → scan</text>
  <text x="965" y="600" text-anchor="middle" class="code">else → fly over safely</text>

  <rect x="145" y="654" width="910" height="42" rx="21" fill="#0f172a" opacity=".88"/>
  <text x="600" y="681" text-anchor="middle" class="code">Screen Down → Paper Blueprint → Code Review → City Simulator → Share Link → Lesson 11 physical prep</text>
</svg>

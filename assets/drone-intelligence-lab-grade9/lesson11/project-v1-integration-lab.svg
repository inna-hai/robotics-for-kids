<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Launchpad Flight Testing - סיור צילום פיזי בכיתה</title>
  <desc id="desc">תרשים שיעור 11: מבחן טיסה פיזי מלא בכיתה, מלבן טיסה בטוח, מסלול ריבוע 150 סנטימטר, שלוש מטרות צילום I-A-I, מכשולים בגובה 80 סנטימטר, פריקת תמונות וכיול.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="zone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#0ea5e9"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.42"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ecfeff">שיעור 11: Launchpad Flight Testing</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#bfdbfe">טיסה פיזית מלאה · צילום מטרות I‑A‑I · Motion Blur · כיול ו־Visual Telemetry</text>

  <g transform="translate(54 122)" filter="url(#shadow)">
    <rect x="0" y="0" width="1092" height="580" rx="30" fill="#f8fafc"/>
    <text x="546" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#172554">זירת סיור וצילום פיזית בכיתה</text>

    <rect x="58" y="86" width="686" height="394" rx="26" fill="url(#zone)" stroke="#22c55e" stroke-width="6" stroke-dasharray="14 10"/>
    <text x="401" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="900" fill="#166534">Safe Fly Zone — מלבן טיסה מסומן</text>

    <path d="M185 390 H612 V185 H185 V390" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="398" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#075985">צלע 150 ס״מ</text>
    <text x="638" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#075985" transform="rotate(90 638 288)">צלע 150 ס״מ</text>

    <g font-family="Arial, sans-serif">
      <rect x="238" y="248" width="118" height="86" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
      <text x="297" y="282" text-anchor="middle" font-size="17" font-weight="900" fill="#991b1b">מכשול A</text>
      <text x="297" y="306" text-anchor="middle" font-size="14" fill="#991b1b">80 ס״מ</text>
      <rect x="538" y="212" width="82" height="62" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
      <text x="579" y="250" text-anchor="middle" font-size="28" font-weight="900" fill="#9a3412">I</text>
      <rect x="332" y="162" width="82" height="62" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
      <text x="373" y="200" text-anchor="middle" font-size="28" font-weight="900" fill="#9a3412">A</text>
      <rect x="150" y="250" width="82" height="62" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
      <text x="191" y="288" text-anchor="middle" font-size="28" font-weight="900" fill="#9a3412">I</text>
      <text x="394" y="154" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">3 תמונות חדות: I‑A‑I</text>
    </g>

    <g transform="translate(780 90)" font-family="Arial, sans-serif">
      <rect x="0" y="0" width="260" height="124" rx="22" fill="#0f172a"/>
      <text x="130" y="34" text-anchor="middle" font-size="20" font-weight="900" fill="#bfdbfe">WiFi Handshake</text>
      <text x="24" y="68" font-size="15" fill="#e0f2fe">1. School WiFi → Load/Save</text>
      <text x="24" y="96" font-size="15" fill="#e0f2fe">2. Tello‑XXXX → Run/Photo</text>

      <rect x="0" y="146" width="260" height="124" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
      <text x="130" y="181" text-anchor="middle" font-size="20" font-weight="900" fill="#9a3412">Motion Blur Fix</text>
      <text x="130" y="213" text-anchor="middle" font-size="16" fill="#9a3412">sleep(2) לפני צילום</text>
      <text x="130" y="241" text-anchor="middle" font-size="16" fill="#9a3412">takePhoto() + sleep(2)</text>

      <rect x="0" y="292" width="260" height="124" rx="22" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
      <text x="130" y="327" text-anchor="middle" font-size="20" font-weight="900" fill="#166534">Team Roles</text>
      <text x="130" y="359" text-anchor="middle" font-size="15" fill="#166534">Driver · Navigator · Observer</text>
      <text x="130" y="386" text-anchor="middle" font-size="15" fill="#166534">משקפי מגן + שתי קופסאות</text>
    </g>

    <rect x="96" y="506" width="900" height="42" rx="21" fill="#172554" opacity="0.96"/>
    <text x="546" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#dbeafe">Deliverable: Meeting11_IAI_Flight_Testing_Calibrated_v2 + 3 תמונות חדות + Share Link + דוח כיול קצר</text>
  </g>
</svg>

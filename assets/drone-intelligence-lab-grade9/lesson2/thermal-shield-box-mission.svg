<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Thermal Shield Box Mission - Strafing מול Yaw</title>
  <desc id="desc">תרשים שיעור 2 לכיתה ט׳: השוואה בין מסלול ריבוע 150 ס״מ Strafing שבו האף והמצלמה נשארים צפונה, לבין מסלול Yaw 150 ס״מ שבו הרחפן פונה 90 מעלות בכל פינה.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#123c69"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#0ea5e9"/></marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#f97316"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#e0f2fe">שיעור 2: Thermal Shield Box Mission</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#bae6fd">אותו ריבוע 150 ס״מ · שתי אסטרטגיות ניווט · סימולטור בלבד</text>

  <g transform="translate(70 126)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="550" rx="30" fill="#f8fafc"/>
    <text x="250" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#075985">גישת Strafing</text>
    <text x="250" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f3b5f">המצלמה נשארת צפונה — Pitch/Roll</text>
    <rect x="82" y="110" width="336" height="336" rx="22" fill="url(#roof)" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="12 10"/>
    <path d="M160 368 L160 188 L340 188 L340 368 L160 368" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
    <g font-family="Arial, sans-serif" font-weight="800" fill="#075985" font-size="16">
      <text x="250" y="178" text-anchor="middle">flyForward(150)</text>
      <text x="365" y="282" text-anchor="middle" transform="rotate(90 365 282)">flyRight(150)</text>
      <text x="250" y="392" text-anchor="middle">flyBackward(150)</text>
      <text x="132" y="282" text-anchor="middle" transform="rotate(-90 132 282)">flyLeft(150)</text>
    </g>
    <g transform="translate(132 340)">
      <circle cx="28" cy="28" r="27" fill="#0f172a"/>
      <text x="28" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#fbbf24">↑</text>
      <text x="28" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#075985">אף צפונה</text>
    </g>
    <rect x="70" y="466" width="360" height="54" rx="16" fill="#ecfeff" stroke="#7dd3fc"/>
    <text x="250" y="499" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#075985">יתרון: זווית צילום קבועה · סיכון: טיסה צדית/אחורית</text>
  </g>

  <g transform="translate(630 126)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="550" rx="30" fill="#f8fafc"/>
    <text x="250" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#9a3412">גישת Yaw</text>
    <text x="250" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f3b5f">האף מסתובב 90° בכל פינה</text>
    <rect x="82" y="110" width="336" height="336" rx="22" fill="url(#roof)" stroke="#f97316" stroke-width="4" stroke-dasharray="12 10"/>
    <path d="M160 368 L160 188 L340 188 L340 368 L160 368" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowOrange)"/>
    <g font-family="Arial, sans-serif" font-weight="800" fill="#9a3412" font-size="16">
      <text x="250" y="178" text-anchor="middle">flyForward(150)</text>
      <text x="375" y="188" text-anchor="middle">yawRight(90)</text>
      <text x="374" y="282" text-anchor="middle" transform="rotate(90 374 282)">flyForward(150)</text>
      <text x="250" y="392" text-anchor="middle">flyForward(150)</text>
      <text x="126" y="282" text-anchor="middle" transform="rotate(-90 126 282)">flyForward(150)</text>
    </g>
    <g transform="translate(132 340)">
      <circle cx="28" cy="28" r="27" fill="#0f172a"/>
      <text x="28" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#fbbf24">↷</text>
      <text x="28" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#9a3412">האף משתנה</text>
    </g>
    <rect x="70" y="466" width="360" height="54" rx="16" fill="#fff7ed" stroke="#fdba74"/>
    <text x="250" y="499" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#9a3412">יתרון: רואה קדימה · סיכון: שינוי זווית צילום</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="210" y="700" width="780" height="38" rx="19" fill="#0f172a" opacity="0.92"/>
    <text x="600" y="725" text-anchor="middle" font-size="18" font-weight="900" fill="#e0f2fe">שאלת מהנדסים: איזו גישה עדיפה — יעילות קוד, בטיחות ניווט או יציבות צילום תרמי?</text>
  </g>
</svg>

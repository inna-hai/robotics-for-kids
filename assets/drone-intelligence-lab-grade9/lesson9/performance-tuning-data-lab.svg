<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Performance Tuning Data Lab - אלגוריתמים וסוללה</title>
  <desc id="desc">תרשים שיעור 9: אזור טיסה פיזי למדידת שתי גרסאות קוד במסלול ריבוע 150 סנטימטר. אלגוריתם א ליניארי עם השהיות ארוכות מול אלגוריתם ב בלולאה אופטימלית. הצוות רושם סוללה התחלתית, סוללה סופית, זמן טיסה וחישוב Burn Rate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="0.55" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <marker id="arrowA" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#fb7185"/></marker>
    <marker id="arrowB" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#22c55e"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.38"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ecfeff">שיעור 9: Performance Tuning Data Lab</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#bae6fd">חצי־פיזי · Telemetry · Battery Burn Rate · Algorithm A מול B · שיטה מטרית</text>

  <g transform="translate(58 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="1084" height="574" rx="30" fill="url(#floor)"/>
    <text x="542" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#0f172a">ניסוי השוואת יעילות — מסלול ריבוע 150 ס״מ</text>

    <rect x="58" y="78" width="520" height="405" rx="24" fill="#f8fafc" stroke="#22c55e" stroke-width="7" stroke-dasharray="16 12"/>
    <text x="318" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#166534">Safe Fly Zone</text>
    <path d="M150 395 H445 V160 H150 V395" fill="none" stroke="#fb7185" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="15 10" marker-end="url(#arrowA)"/>
    <path d="M190 360 H405 V198 H190 V360" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowB)"/>
    <g font-family="Arial, sans-serif" font-weight="900">
      <text x="298" y="146" text-anchor="middle" font-size="17" fill="#991b1b">אלגוריתם א׳: ליניארי + sleep ארוך</text>
      <text x="298" y="438" text-anchor="middle" font-size="17" fill="#166534">אלגוריתם ב׳: for loop + sleep קצר</text>
      <rect x="113" y="372" width="150" height="46" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="188" y="401" text-anchor="middle" font-size="16" fill="#166534">מנחת · 100 ס״מ</text>
      <rect x="274" y="248" width="84" height="74" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
      <text x="316" y="291" text-anchor="middle" font-size="16" fill="#1e3a8a">בניין סריקה</text>
    </g>

    <g transform="translate(156 338)">
      <ellipse cx="34" cy="58" rx="58" ry="12" fill="#0f172a" opacity="0.22"/>
      <rect x="7" y="20" width="54" height="27" rx="14" fill="#111827"/>
      <circle cx="5" cy="18" r="14" fill="#334155"/><circle cx="65" cy="18" r="14" fill="#334155"/><circle cx="5" cy="49" r="14" fill="#334155"/><circle cx="65" cy="49" r="14" fill="#334155"/>
      <text x="34" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#fbbf24">Tello</text>
    </g>

    <g font-family="Arial, sans-serif">
      <rect x="620" y="78" width="408" height="152" rx="22" fill="#0f172a" opacity="0.95"/>
      <text x="824" y="114" text-anchor="middle" font-size="22" font-weight="900" fill="#bfdbfe">טבלת Telemetry</text>
      <text x="650" y="154" font-size="18" fill="#e0f2fe">Algorithm A: Start 85% → End 79% · 32 sec</text>
      <text x="650" y="188" font-size="18" fill="#e0f2fe">Algorithm B: Start 79% → End 76% · 20 sec</text>

      <rect x="620" y="258" width="408" height="132" rx="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="3"/>
      <text x="824" y="294" text-anchor="middle" font-size="22" font-weight="900" fill="#075985">חישוב יעילות</text>
      <text x="650" y="334" font-size="20" font-weight="800" fill="#075985">ΔBattery = Start% - End%</text>
      <text x="650" y="368" font-size="20" font-weight="800" fill="#075985">Burn Rate = ΔBattery / seconds</text>

      <rect x="620" y="418" width="408" height="80" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
      <text x="824" y="451" text-anchor="middle" font-size="21" font-weight="900" fill="#166534">מסקנת מהנדסים</text>
      <text x="824" y="477" text-anchor="middle" font-size="17" fill="#166534">איזה קוד חסך זמן, שורות ואחוזי סוללה?</text>
    </g>

    <rect x="116" y="514" width="850" height="38" rx="19" fill="#0f172a" opacity="0.92"/>
    <text x="541" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#e0f2fe">Deliverable: Meeting9_Algorithm_Perfect_v3 + טבלת נתונים + המלצה Data‑Driven</text>
  </g>
</svg>

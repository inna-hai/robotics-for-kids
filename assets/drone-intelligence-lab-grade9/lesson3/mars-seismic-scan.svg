<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mars Seismic Scan - ניווט תלת ממדי במאדים</title>
  <desc id="desc">תרשים שיעור 3: רחפן Ingenuity-2 ממריא במאדים, עולה מעל רכס בזלת בגובה 150 ס״מ, יורד לתחנת סייסמוגרף בגובה 80 ס״מ, עולה לגובה 220 ס״מ לסריקת פאנלים סולאריים ונוחת במנחת מוגן.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#451a03"/><stop offset="0.55" stop-color="#9a3412"/><stop offset="1" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c2d12"/><stop offset="0.5" stop-color="#ea580c"/><stop offset="1" stop-color="#9a3412"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#22d3ee"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#sky)"/>
  <circle cx="980" cy="115" r="62" fill="#fde68a" opacity="0.9"/>
  <circle cx="1035" cy="92" r="24" fill="#fed7aa" opacity="0.8"/>
  <path d="M0 575 C150 520 250 615 390 560 C540 500 680 600 835 535 C1000 468 1085 560 1200 515 L1200 760 L0 760 Z" fill="url(#ground)"/>
  <path d="M70 602 C240 560 305 640 460 590 C635 535 760 620 940 570 C1050 540 1115 565 1200 545" fill="none" stroke="#fdba74" stroke-width="4" opacity="0.5"/>

  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7ed">שיעור 3: Mars Seismic Scan</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fed7aa">Ingenuity-2 · Mars Simulator · ניווט תלת־ממדי · שמירה בענן</text>

  <g filter="url(#shadow)">
    <rect x="70" y="132" width="1060" height="470" rx="30" fill="#fff7ed" opacity="0.93"/>
    <rect x="98" y="165" width="1004" height="378" rx="24" fill="#ffedd5" stroke="#fb923c" stroke-width="3" stroke-dasharray="12 10"/>
    <text x="600" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#7c2d12">מסלול חקר תלת־ממדי בסימולטור מאדים</text>

    <path d="M200 485 L200 350 L410 350 L410 430 L650 430 L650 260 L825 260 L825 380 L1000 380" fill="none" stroke="#22d3ee" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M145 500 C215 350 300 480 382 360 C455 255 535 515 620 438 C705 365 728 230 820 265 C915 300 920 420 1040 382" fill="none" stroke="#0f172a" stroke-width="3" stroke-dasharray="8 8" opacity="0.45"/>

    <g font-family="Arial, sans-serif">
      <rect x="134" y="468" width="132" height="54" rx="15" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
      <text x="200" y="493" text-anchor="middle" font-size="18" font-weight="900" fill="#166534">מנחת המראה</text>
      <text x="200" y="514" text-anchor="middle" font-size="14" fill="#166534">takeoff + sleep(3)</text>

      <polygon points="328,486 386,336 446,486" fill="#7c2d12" opacity="0.9"/>
      <polygon points="380,384 410,306 440,384" fill="#431407" opacity="0.8"/>
      <text x="410" y="512" text-anchor="middle" font-size="17" font-weight="900" fill="#7c2d12">רכס בזלת</text>
      <text x="410" y="533" text-anchor="middle" font-size="14" fill="#7c2d12">flyUp(150)</text>

      <rect x="568" y="402" width="164" height="74" rx="16" fill="#ecfeff" stroke="#0ea5e9" stroke-width="3"/>
      <circle cx="610" cy="439" r="18" fill="#0f172a"/>
      <path d="M610 420 L610 400 M594 430 L578 418 M626 430 L642 418" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
      <text x="667" y="432" text-anchor="middle" font-size="18" font-weight="900" fill="#075985">תחנה א׳</text>
      <text x="667" y="456" text-anchor="middle" font-size="14" fill="#075985">סייסמוגרף · 80 ס״מ · sleep(4)</text>

      <g transform="translate(755 219)">
        <rect x="0" y="0" width="190" height="92" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
        <rect x="18" y="18" width="52" height="56" fill="url(#panel)"/><rect x="78" y="18" width="52" height="56" fill="url(#panel)"/><rect x="138" y="18" width="34" height="56" fill="url(#panel)"/>
        <text x="95" y="118" text-anchor="middle" font-size="17" font-weight="900" fill="#7c2d12">תחנה ב׳: פאנלים סולאריים</text>
        <text x="95" y="140" text-anchor="middle" font-size="14" fill="#7c2d12">גובה 220 ס״מ · sleep(3)</text>
      </g>

      <rect x="934" y="352" width="132" height="54" rx="15" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
      <text x="1000" y="377" text-anchor="middle" font-size="18" font-weight="900" fill="#166534">מנחת מוגן</text>
      <text x="1000" y="398" text-anchor="middle" font-size="14" fill="#166534">land</text>
    </g>

    <g transform="translate(174 315)">
      <ellipse cx="36" cy="66" rx="64" ry="13" fill="#0f172a" opacity="0.2"/>
      <rect x="8" y="22" width="56" height="28" rx="14" fill="#111827"/>
      <circle cx="6" cy="20" r="14" fill="#334155"/><circle cx="66" cy="20" r="14" fill="#334155"/><circle cx="6" cy="52" r="14" fill="#334155"/><circle cx="66" cy="52" r="14" fill="#334155"/>
      <text x="36" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#fbbf24">Ingenuity‑2</text>
    </g>
  </g>

  <rect x="130" y="640" width="940" height="58" rx="22" fill="#0f172a" opacity="0.92"/>
  <text x="600" y="674" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#e0f2fe">רצף משימה: takeoff → flyUp(150) → flyForward(250) → flyDown(70) → flyUp(140) → yawRight(90) → flyForward(200/300) → land</text>
</svg>

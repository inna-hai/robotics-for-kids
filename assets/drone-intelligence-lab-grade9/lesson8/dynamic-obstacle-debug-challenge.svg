<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic Obstacle Debug Challenge - מכשולים דינמיים</title>
  <desc id="desc">תרשים שיעור 8: הטסה פיזית באזור סטרילי עם מכשול בסיסי בגובה 80 סנטימטר במרחק 120 סנטימטר, ואז שינוי דינמי: מכשול בגובה 110 סנטימטר במרחק 150 סנטימטר ומכשול צדדי במרחק 80 סנטימטר. הצוות מעדכן משתנים תוך 10 דקות.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#164e63"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#22c55e"/></marker>
    <marker id="warnArrow" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#f97316"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ecfeff">שיעור 8: Dynamic Obstacles Challenge</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#bae6fd">הטסה פיזית · Telemetry · Version Control · Debugging ב־10 דקות · שיטה מטרית</text>

  <g transform="translate(58 122)" filter="url(#shadow)">
    <rect x="0" y="0" width="1084" height="574" rx="30" fill="url(#floor)"/>
    <text x="542" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#0f172a">Safe Fly Zone — אזור טיסה סטרילי עם מכשול דינמי</text>

    <rect x="70" y="80" width="685" height="405" rx="24" fill="#ecfdf5" stroke="#22c55e" stroke-width="8" stroke-dasharray="18 12"/>
    <text x="412" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="900" fill="#166534">אין כניסה למלבן בזמן רחפן באוויר</text>

    <path d="M175 390 H420 C470 390 492 348 516 312 C548 265 604 250 650 252" fill="none" stroke="#22c55e" stroke-width="11" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M175 390 H468 C510 390 540 324 590 292 C638 262 670 218 690 175" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 12" marker-end="url(#warnArrow)"/>

    <g font-family="Arial, sans-serif" font-weight="900">
      <rect x="105" y="362" width="142" height="56" rx="17" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="176" y="386" text-anchor="middle" font-size="17" fill="#166534">מנחת המראה</text>
      <text x="176" y="407" text-anchor="middle" font-size="14" fill="#166534">גובה מעבר 100 ס״מ</text>

      <rect x="390" y="305" width="80" height="85" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
      <text x="430" y="296" text-anchor="middle" font-size="16" fill="#92400e">מכשול א׳ v1</text>
      <text x="430" y="418" text-anchor="middle" font-size="14" fill="#92400e">80 ס״מ · 120 ס״מ מהמנחת</text>

      <rect x="512" y="250" width="92" height="120" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
      <text x="558" y="238" text-anchor="middle" font-size="16" fill="#991b1b">מכשול א׳ זז</text>
      <text x="558" y="394" text-anchor="middle" font-size="14" fill="#991b1b">110 ס״מ · 150 ס״מ</text>

      <rect x="622" y="338" width="82" height="72" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="3"/>
      <text x="663" y="430" text-anchor="middle" font-size="14" fill="#075985">מכשול ב׳ צדדי</text>
      <text x="663" y="449" text-anchor="middle" font-size="13" fill="#075985">80 ס״מ ימינה</text>

      <rect x="600" y="145" width="125" height="52" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
      <text x="663" y="177" text-anchor="middle" font-size="17" fill="#166534">מנחת נחיתה</text>
    </g>

    <g transform="translate(145 342)">
      <ellipse cx="34" cy="58" rx="58" ry="12" fill="#0f172a" opacity="0.22"/>
      <rect x="7" y="20" width="54" height="27" rx="14" fill="#111827"/>
      <circle cx="5" cy="18" r="14" fill="#334155"/><circle cx="65" cy="18" r="14" fill="#334155"/><circle cx="5" cy="49" r="14" fill="#334155"/><circle cx="65" cy="49" r="14" fill="#334155"/>
      <text x="34" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#fbbf24">Tello</text>
    </g>

    <g font-family="Arial, sans-serif">
      <rect x="795" y="82" width="242" height="145" rx="22" fill="#0f172a" opacity="0.94"/>
      <text x="916" y="118" text-anchor="middle" font-size="22" font-weight="900" fill="#bfdbfe">גרסאות בענן</text>
      <text x="820" y="158" font-size="17" fill="#e0f2fe">v1: Meeting8_Dynamic_Obstacles_v1</text>
      <text x="820" y="190" font-size="17" fill="#e0f2fe">solved: Dynamic_Challenge_Solved</text>

      <rect x="795" y="255" width="242" height="132" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
      <text x="916" y="291" text-anchor="middle" font-size="22" font-weight="900" fill="#9a3412">Telemetry Bar</text>
      <text x="820" y="329" font-size="17" fill="#9a3412">גובה בפועל</text>
      <text x="820" y="358" font-size="17" fill="#9a3412">סוללה מעל 30%</text>

      <rect x="795" y="416" width="242" height="70" rx="22" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
      <text x="916" y="446" text-anchor="middle" font-size="20" font-weight="900" fill="#991b1b">10 דקות Debug</text>
      <text x="916" y="471" text-anchor="middle" font-size="15" fill="#991b1b">משנים משתנים, לא מוחקים קוד</text>
    </g>

    <rect x="100" y="508" width="880" height="40" rx="20" fill="#0f172a" opacity="0.92"/>
    <text x="540" y="534" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#e0f2fe">Dynamic update: obstacleDistance=150, obstacleHeight=110, sideObstacleDistance=80, clearanceAltitude=130</text>
  </g>
</svg>

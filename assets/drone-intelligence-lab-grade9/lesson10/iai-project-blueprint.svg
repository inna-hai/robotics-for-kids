<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">IAI Project Blueprint - סיור אבטחה אוטונומי</title>
  <desc id="desc">תרשים שיעור 10: Blueprint לפרויקט גמר. מתחם אבטחה ריבועי 150 על 150 סנטימטר, בניין מרכזי בגובה 110 סנטימטר, גובה סיור 120 סנטימטר, פונקציית patrolZone, משתנה intrusionDetected ותכנון נייר לפני קוד.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#0ea5e9"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.38"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ecfeff">שיעור 10: IAI Project Blueprint</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#bae6fd">System Design · טאבלטים הפוכים · Helper Functions · City Simulator · שיטה מטרית</text>

  <g transform="translate(58 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="1084" height="574" rx="30" fill="#f8fafc"/>
    <text x="542" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#0f172a">Blueprint למעבדה חכמה בשטח — מתחם אבטחה IAI</text>

    <rect x="56" y="78" width="530" height="410" rx="24" fill="url(#paper)" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="12 10"/>
    <g stroke="#cbd5e1" stroke-width="1" opacity="0.55">
      <path d="M86 108 H556 M86 148 H556 M86 188 H556 M86 228 H556 M86 268 H556 M86 308 H556 M86 348 H556 M86 388 H556 M86 428 H556"/>
      <path d="M106 98 V468 M146 98 V468 M186 98 V468 M226 98 V468 M266 98 V468 M306 98 V468 M346 98 V468 M386 98 V468 M426 98 V468 M466 98 V468 M506 98 V468 M546 98 V468"/>
    </g>
    <text x="321" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#075985">שרטוט נייר לפני קוד</text>

    <path d="M170 405 H455 V155 H170 V405" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="255" y="240" width="118" height="96" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="314" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#991b1b">בניין</text>
    <text x="314" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">110 ס״מ</text>
    <g font-family="Arial, sans-serif" font-weight="900" fill="#075985" font-size="16">
      <text x="312" y="388" text-anchor="middle">צלע 150 ס״מ</text>
      <text x="482" y="282" text-anchor="middle" transform="rotate(90 482 282)">צלע 150 ס״מ</text>
      <text x="170" y="431" text-anchor="middle">פינה א׳ / מנחת</text>
      <text x="455" y="142" text-anchor="middle">פינה ב׳</text>
      <text x="170" y="142" text-anchor="middle">פינה ג׳</text>
      <text x="455" y="431" text-anchor="middle">פינה ד׳</text>
    </g>

    <path d="M170 405 C245 340 278 316 314 288" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round" stroke-dasharray="12 9" marker-end="url(#arrow)"/>
    <text x="250" y="354" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#9a3412">intrusionDetected == true</text>

    <g font-family="Arial, sans-serif">
      <rect x="628" y="78" width="402" height="130" rx="22" fill="#0f172a" opacity="0.95"/>
      <text x="829" y="114" text-anchor="middle" font-size="22" font-weight="900" fill="#bfdbfe">Global Variables</text>
      <text x="660" y="152" font-size="18" fill="#e0f2fe">let scanDistance = 150;</text>
      <text x="660" y="180" font-size="18" fill="#e0f2fe">let safeAltitude = 120;</text>
      <text x="840" y="180" font-size="18" fill="#e0f2fe">let intrusionDetected = false;</text>

      <rect x="628" y="232" width="402" height="150" rx="22" fill="#ecfeff" stroke="#0ea5e9" stroke-width="3"/>
      <text x="829" y="268" text-anchor="middle" font-size="22" font-weight="900" fill="#075985">Helper Function</text>
      <text x="660" y="308" font-size="19" font-weight="800" fill="#075985">function patrolZone(sides, distance) {</text>
      <text x="692" y="340" font-size="18" fill="#075985">for (let i = 0; i &lt; sides; i++)</text>
      <text x="660" y="368" font-size="19" font-weight="800" fill="#075985">}</text>

      <rect x="628" y="408" width="402" height="78" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
      <text x="829" y="440" text-anchor="middle" font-size="20" font-weight="900" fill="#9a3412">If / Else Project Logic</text>
      <text x="829" y="466" text-anchor="middle" font-size="16" fill="#9a3412">חדירה → סריקה במרכז | אין חדירה → סיור היקפי</text>
    </g>

    <rect x="112" y="510" width="865" height="40" rx="20" fill="#0f172a" opacity="0.92"/>
    <text x="545" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#e0f2fe">Deliverable: Meeting10_IAI_Project_Final_Blueprint + שרטוט נייר + Skeleton Code + Share Link</text>
  </g>
</svg>

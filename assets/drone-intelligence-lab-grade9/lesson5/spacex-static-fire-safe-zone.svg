<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">SpaceX Static Fire - אזור טיסה סטרילי</title>
  <desc id="desc">תרשים שיעור 5: הטסה פיזית ראשונה. מלבן טיסה מסומן בכיתה, מסלול ריבוע מטרי של 100 סנטימטר בגובה 100 סנטימטר, עמדת צוות עם Driver Navigator Observer, נוהל סוללות ושער בטיחות.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="0.55" stop-color="#172554"/><stop offset="1" stop-color="#7c2d12"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M2,2 L12,7 L2,12 Z" fill="#22c55e"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.42"/></filter>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#fff7ed">שיעור 5: SpaceX Static Fire</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#fed7aa">הטסה פיזית ראשונה · Safe Fly Zone · כיול Sim‑to‑Reality · שיטה מטרית</text>

  <g transform="translate(65 122)" filter="url(#shadow)">
    <rect x="0" y="0" width="1070" height="574" rx="30" fill="url(#floor)"/>
    <text x="535" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#0f172a">גבול כיתה בטוח — אין כניסה בזמן רחפן באוויר</text>

    <rect x="72" y="82" width="670" height="390" rx="24" fill="#ecfdf5" stroke="#22c55e" stroke-width="8" stroke-dasharray="18 12"/>
    <text x="407" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#166534">מלבן טיסה מסומן</text>
    <text x="407" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#166534">רק צוות מטיס מורשה · משקפי מגן · Observer בקשר עין</text>

    <path d="M190 392 H510 V225 H190 V392" fill="none" stroke="#22c55e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <g font-family="Arial, sans-serif" fill="#166534" font-weight="900" font-size="17">
      <text x="350" y="375" text-anchor="middle">קדימה 100 ס״מ</text>
      <text x="542" y="306" text-anchor="middle" transform="rotate(90 542 306)">ימינה 100 ס״מ</text>
      <text x="350" y="212" text-anchor="middle">אחורה / חזרה 100 ס״מ</text>
      <text x="158" y="306" text-anchor="middle" transform="rotate(-90 158 306)">שמאלה 100 ס״מ</text>
    </g>

    <g transform="translate(162 365)">
      <ellipse cx="34" cy="58" rx="58" ry="12" fill="#0f172a" opacity="0.22"/>
      <rect x="7" y="20" width="54" height="27" rx="14" fill="#111827"/>
      <circle cx="5" cy="18" r="14" fill="#334155"/><circle cx="65" cy="18" r="14" fill="#334155"/><circle cx="5" cy="49" r="14" fill="#334155"/><circle cx="65" cy="49" r="14" fill="#334155"/>
      <text x="34" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#fbbf24">Tello</text>
    </g>
    <rect x="125" y="410" width="140" height="34" rx="17" fill="#dcfce7" stroke="#16a34a"/>
    <text x="195" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#166534">מנחת המראה</text>

    <g font-family="Arial, sans-serif">
      <rect x="790" y="84" width="230" height="154" rx="22" fill="#0f172a" opacity="0.94"/>
      <text x="905" y="120" text-anchor="middle" font-size="22" font-weight="900" fill="#bfdbfe">צוות 3 תפקידים</text>
      <text x="820" y="158" font-size="18" fill="#e0f2fe">Driver — טאבלט והרצה</text>
      <text x="820" y="190" font-size="18" fill="#e0f2fe">Navigator — סינטקס וסטייה</text>
      <text x="820" y="222" font-size="18" fill="#e0f2fe">Observer — בטיחות וקשר עין</text>

      <rect x="790" y="266" width="230" height="126" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
      <text x="905" y="302" text-anchor="middle" font-size="21" font-weight="900" fill="#9a3412">WiFi Handshake</text>
      <text x="812" y="337" font-size="17" fill="#9a3412">1. WiFi בית ספרי → Load</text>
      <text x="812" y="367" font-size="17" fill="#9a3412">2. Tello‑XXXX → Run</text>

      <rect x="790" y="420" width="230" height="82" rx="22" fill="#fef2f2" stroke="#fb7185" stroke-width="3"/>
      <text x="905" y="454" text-anchor="middle" font-size="20" font-weight="900" fill="#991b1b">שער בטיחות</text>
      <text x="905" y="481" text-anchor="middle" font-size="16" fill="#991b1b">Abort מוכן · אין כניסה למלבן</text>
    </g>

    <g transform="translate(90 500)" font-family="Arial, sans-serif">
      <rect x="0" y="0" width="890" height="42" rx="21" fill="#0f172a" opacity="0.92"/>
      <text x="445" y="28" text-anchor="middle" font-size="18" font-weight="900" fill="#e0f2fe">כיול: אם טס 90 ס״מ במקום 100 — מעדכנים sideLength ל־110, שומרים v2 ומריצים רק באישור מדריך</text>
    </g>
  </g>
</svg>

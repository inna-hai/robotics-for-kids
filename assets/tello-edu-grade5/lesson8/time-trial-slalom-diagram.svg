<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">מסלול Time Trial סלאלום לכיתה ה</title>
  <desc id="desc">תרשים אזור טיסה בטוח עם מנחת המראה, שלושה קונוסים, נתיב S, אזור נחיתה וקנסות זמן.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
  <rect x="70" y="80" width="1060" height="560" rx="32" fill="#ffffff" stroke="#22c55e" stroke-width="8" stroke-dasharray="18 14" filter="url(#shadow)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#172033">ליגת מרוצי הרחפנים — Time Trial בטוח</text>
  <text x="600" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#166534">Safe Fly Zone: רק צוות אחד באוויר, משקפי מגן, אישור מדריך לפני Run</text>
  <rect x="880" y="480" width="170" height="90" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
  <text x="965" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#166534">START</text>
  <text x="965" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#166534">Takeoff / Land</text>
  <rect x="150" y="120" width="165" height="90" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
  <text x="232" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1e40af">FINISH</text>
  <text x="232" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e40af">נחיתה מדויקת</text>
  <path d="M880 520 C720 520,760 375,615 375 S420 330,470 245 S330 165,300 165" fill="none" stroke="#0f766e" stroke-width="14" stroke-linecap="round" stroke-dasharray="26 18" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" font-weight="800" text-anchor="middle">
    <g transform="translate(705 480)"><polygon points="0,-42 38,35 -38,35" fill="#fb923c" stroke="#c2410c" stroke-width="5"/><text y="72" font-size="20" fill="#9a3412">קונוס א׳</text></g>
    <g transform="translate(575 330)"><polygon points="0,-42 38,35 -38,35" fill="#fb923c" stroke="#c2410c" stroke-width="5"/><text y="72" font-size="20" fill="#9a3412">קונוס ב׳</text></g>
    <g transform="translate(400 235)"><polygon points="0,-42 38,35 -38,35" fill="#fb923c" stroke="#c2410c" stroke-width="5"/><text y="72" font-size="20" fill="#9a3412">קונוס ג׳</text></g>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="790" y="130" width="285" height="142" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="4"/>
    <text x="932" y="166" text-anchor="middle" font-size="24" font-weight="900" fill="#c2410c">מדדי ניצחון</text>
    <text x="1055" y="205" text-anchor="end" font-size="19" fill="#172033">⏱ זמן מהרצה עד Land</text>
    <text x="1055" y="235" text-anchor="end" font-size="19" fill="#172033">🎯 דיוק נחיתה</text>
    <text x="1055" y="265" text-anchor="end" font-size="19" fill="#172033">🔋 סוללה מעל 30%</text>
    <rect x="110" y="485" width="310" height="105" rx="22" fill="#fee2e2" stroke="#fb7185" stroke-width="4"/>
    <text x="390" y="525" text-anchor="end" font-size="22" font-weight="900" fill="#be123c">קנסות זמן</text>
    <text x="390" y="555" text-anchor="end" font-size="18" fill="#172033">נגיעה בקונוס: +5 שניות</text>
    <text x="390" y="582" text-anchor="end" font-size="18" fill="#172033">פספוס מנחת: +10 שניות</text>
  </g>
  <text x="600" y="675" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0f766e">שיפור מותר: פרמטר אחד בלבד — מהירות, מרחק או השהייה לפני נחיתה</text>
</svg>
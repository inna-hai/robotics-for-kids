<title id="title">Tello Project Blueprint City Simulator</title><desc id="desc">תרשים Blueprint לפרויקט Flytrex בסימולטור עיר: בסיס, שלוש תחנות, גבהים, משתנה base_distance, לולאה וחזרה לבסיס.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">מסלול שליחויות רב תחנות</title>
  <desc id="desc">מנחת, שלוש תחנות דואר, חצים וריחוף מעל תחנות</desc>
  <rect width="960" height="540" rx="32" fill="#fff7ed"/>
  <rect x="70" y="60" width="820" height="410" rx="28" fill="#ffffff" stroke="#f97316" stroke-width="6" stroke-dasharray="16 12"/>
  <g font-family="Arial" text-anchor="middle">
    <circle cx="160" cy="390" r="44" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="160" y="398" font-size="20" font-weight="700" fill="#1e3a8a">מנחת</text>
    <rect x="305" y="120" width="150" height="74" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="380" y="165" font-size="22" font-weight="700" fill="#166534">תחנה א׳</text>
    <rect x="610" y="120" width="150" height="74" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="685" y="165" font-size="22" font-weight="700" fill="#92400e">תחנה ב׳</text>
    <rect x="610" y="340" width="150" height="74" rx="16" fill="#fae8ff" stroke="#9333ea" stroke-width="4"/><text x="685" y="385" font-size="22" font-weight="700" fill="#6b21a8">תחנה ג׳</text>
  </g>
  <g stroke="#0f172a" stroke-width="6" fill="none" marker-end="url(#arrow)">
    <path d="M195 365 C250 290 300 220 350 190"/>
    <path d="M455 157 H610"/>
    <path d="M685 194 V340"/>
    <path d="M610 380 C440 430 300 430 200 405"/>
  </g>
  <g font-family="Arial" font-size="22" fill="#0f172a" text-anchor="middle">
    <text x="355" y="245">Forward 100cm</text><text x="535" y="142">Right 120cm</text><text x="760" y="275">Backward 100cm</text><text x="480" y="465">Land / חזרה</text>
    <text x="480" y="520" font-size="26" font-weight="700">בכל תחנה: Hover / Delay 2–3 sec</text>
  </g>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/></marker></defs>
</svg>

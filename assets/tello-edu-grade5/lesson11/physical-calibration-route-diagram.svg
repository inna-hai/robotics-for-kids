<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Physical Integration and Calibration Route</title><desc id="desc">תרשים מעבר מהסימולטור למסלול פיזי: מנחת א, קונוס, כיסא, מנחת ב, מדידת סחיפה וכיול distance.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker><marker id="drift" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#e11d48"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="720" rx="42" fill="url(#bg)"/><text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#172033">Launchpad Testing — מעבר לפיזי וכיול ראשוני</text><text x="600" y="92" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#0f766e">מריצים קטן, מודדים סטייה, משנים רק את distance</text>
<rect x="70" y="120" width="1060" height="500" rx="32" fill="#fff" stroke="#22c55e" stroke-width="7" stroke-dasharray="18 14" filter="url(#shadow)"/><text x="600" y="152" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#166534">Safe Fly Zone — צוות אחד באוויר, משקפי מגן, Observer בקשר עין</text>
<g font-family="Arial" text-anchor="middle" font-weight="800"><rect x="890" y="470" width="170" height="86" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><text x="975" y="508" font-size="22" fill="#166534">מנחת א׳</text><text x="975" y="536" font-size="17" fill="#166534">Takeoff</text><polygon points="700,420 742,500 658,500" fill="#fb923c" stroke="#c2410c" stroke-width="5"/><text x="700" y="532" font-size="20" fill="#9a3412">קונוס 1</text><rect x="485" y="310" width="120" height="150" rx="16" fill="#d6d3d1" stroke="#57534e" stroke-width="5"/><rect x="455" y="285" width="180" height="35" rx="10" fill="#a8a29e"/><text x="545" y="492" font-size="20" fill="#44403c">כיסא / בניין</text><rect x="160" y="210" width="178" height="86" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><text x="249" y="248" font-size="22" fill="#1e40af">מנחת ב׳</text><text x="249" y="276" font-size="17" fill="#1e40af">יעד</text></g>
<path d="M890 510 C805 510,800 460,730 462 S620 435,568 385 S420 250,338 252" fill="none" stroke="#0f766e" stroke-width="13" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M292 252 C260 305,250 355,220 395" fill="none" stroke="#e11d48" stroke-width="9" stroke-linecap="round" stroke-dasharray="16 12" marker-end="url(#drift)"/><text x="232" y="424" text-anchor="middle" font-family="Arial" font-size="19" font-weight="900" fill="#be123c">סטייה 15–30 ס״מ?</text>
<g font-family="Arial"><rect x="790" y="185" width="300" height="168" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="4"/><text x="1068" y="224" text-anchor="end" font-size="24" font-weight="900" fill="#c2410c">דף כיול</text><text x="1068" y="262" text-anchor="end" font-size="18" fill="#172033">טיסה 1: קצר ב־20 ס״מ</text><text x="1068" y="292" text-anchor="end" font-size="18" fill="#172033">שינוי: distance 100→120</text><text x="1068" y="322" text-anchor="end" font-size="18" fill="#172033">טיסה 2: מדויק יותר</text><rect x="105" y="385" width="320" height="158" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="4"/><text x="400" y="424" text-anchor="end" font-size="24" font-weight="900" fill="#1d4ed8">Simulation Gap</text><text x="400" y="462" text-anchor="end" font-size="18" fill="#172033">רוח מזגן / תאורה / VPS</text><text x="400" y="492" text-anchor="end" font-size="18" fill="#172033">סוללה חלשה משנה דיוק</text><text x="400" y="522" text-anchor="end" font-size="18" fill="#172033">לא משנים את כל הבלוקים</text></g>
<text x="600" y="674" text-anchor="middle" font-family="Arial" font-size="23" font-weight="900" fill="#0f766e">כיול נכון = ניסוי קצר → מדידה בס״מ → שינוי משתנה אחד → ניסוי חוזר</text></svg>
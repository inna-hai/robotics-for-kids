<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">תרשים משימת חירום וטורבינת רוח בסערה</title>
  <desc id="desc">אזור טיסה בטוח עם מסלול רגיל, מנחת יעד חסום, מנחת חירום צהוב וקוד גיבוי.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#fefce8"/></linearGradient>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/></marker>
    <marker id="arrowYellow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#ca8a04"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
  <rect x="68" y="82" width="1064" height="548" rx="32" fill="#fff" stroke="#0ea5e9" stroke-width="7" stroke-dasharray="18 14" filter="url(#shadow)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#172033">צוות דיבאג שטח — טורבינת הרוח בסערה</text>
  <text x="600" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0369a1">כשיש ספק: Abort / Land. תוכנית גיבוי היא הצלחה הנדסית.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-weight="800">
    <rect x="880" y="480" width="175" height="90" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
    <text x="967" y="518" font-size="22" fill="#166534">נקודת מוצא</text><text x="967" y="548" font-size="18" fill="#166534">Takeoff</text>
    <rect x="170" y="450" width="185" height="94" rx="18" fill="#bbf7d0" stroke="#16a34a" stroke-width="5"/>
    <text x="262" y="488" font-size="22" fill="#166534">מנחת יעד</text><text x="262" y="518" font-size="18" fill="#166534">Grid_Normal</text>
    <rect x="515" y="145" width="205" height="95" rx="18" fill="#fef08a" stroke="#ca8a04" stroke-width="5"/>
    <text x="617" y="184" font-size="22" fill="#854d0e">מנחת חירום</text><text x="617" y="214" font-size="18" fill="#854d0e">Grid_Emergency_v2</text>
  </g>
  <path d="M880 520 C730 520,715 410,605 410 S430 470,355 495" fill="none" stroke="#16a34a" stroke-width="13" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <path d="M520 410 C560 345,595 285,615 245" fill="none" stroke="#ca8a04" stroke-width="13" stroke-linecap="round" stroke-dasharray="24 16" marker-end="url(#arrowYellow)"/>
  <path d="M390 498 L318 498" fill="none" stroke="#dc2626" stroke-width="12" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <g font-family="Arial, sans-serif" font-weight="800" text-anchor="middle">
    <g transform="translate(690 418)"><circle r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><path d="M0,-34 L8,-5 L37,0 L8,5 L0,34 L-8,5 L-37,0 L-8,-5 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="3"/><text y="76" font-size="20" fill="#1e40af">טורבינה א׳</text></g>
    <g transform="translate(465 492)"><circle r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><path d="M0,-34 L8,-5 L37,0 L8,5 L0,34 L-8,5 L-37,0 L-8,-5 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="3"/><text y="76" font-size="20" fill="#1e40af">טורבינה ב׳</text></g>
  </g>
  <rect x="210" y="375" width="185" height="78" rx="14" fill="#fecaca" stroke="#dc2626" stroke-width="5" transform="rotate(-8 302 414)"/>
  <text x="304" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#991b1b" transform="rotate(-8 304 407)">מכשול חוסם!</text>
  <text x="304" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#991b1b" transform="rotate(-8 304 435)">יעד ירוק נסגר</text>
  <g font-family="Arial, sans-serif">
    <rect x="790" y="142" width="300" height="190" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="1068" y="181" text-anchor="end" font-size="24" font-weight="900" fill="#172033">קוד רגיל</text>
    <text x="1068" y="218" text-anchor="end" font-size="19" fill="#172033">Takeoff → Forward 100in</text>
    <text x="1068" y="249" text-anchor="end" font-size="19" fill="#172033">Right 60in → Land בירוק</text>
    <text x="1068" y="289" text-anchor="end" font-size="18" font-weight="800" fill="#16a34a">רצים רק כשהמסלול פתוח</text>
    <rect x="105" y="135" width="330" height="190" rx="24" fill="#fffbeb" stroke="#facc15" stroke-width="4"/>
    <text x="410" y="176" text-anchor="end" font-size="24" font-weight="900" fill="#854d0e">קוד גיבוי</text>
    <text x="410" y="213" text-anchor="end" font-size="19" fill="#172033">Abort אם יש סכנה מיידית</text>
    <text x="410" y="244" text-anchor="end" font-size="19" fill="#172033">Yaw Left 90° → Forward 50in</text>
    <text x="410" y="275" text-anchor="end" font-size="19" fill="#172033">Land במנחת הצהוב</text>
  </g>
  <text x="600" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#0369a1">Incident Log: בעיה → החלטה → תוצאה → תיקון להרצה הבאה</text>
</svg>
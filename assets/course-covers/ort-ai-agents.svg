<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">ORT AI Agents course cover</title>
  <desc id="desc">Abstract interface cards for an AI agents course.</desc>
  <defs>

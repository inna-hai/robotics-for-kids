<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Variable controls scan distance">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f0fdf4"/><stop offset="1" stop-color="#eff6ff"/></linearGradient></defs>
  <rect width="900" height="560" rx="34" fill="url(#bg)"/>
  <text x="450" y="54" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#0f172a">Variable — כפתור המרחק של המשימה</text>
  <rect x="80" y="105" width="310" height="330" rx="26" fill="#fff" stroke="#22c55e" stroke-width="5"/>
  <text x="235" y="150" text-anchor="middle" font-family="Arial" font-size="28" font-weight="900" fill="#166534">row_length = 80</text>
  <line x1="130" y1="240" x2="340" y2="240" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/>
  <circle cx="250" cy="240" r="28" fill="#f97316"/>
  <text x="235" y="330" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#334155">משנים ערך אחד</text>
  <text x="235" y="365" text-anchor="middle" font-family="Arial" font-size="22" fill="#334155">כל פקודות המרחק מתעדכנות</text>
  <rect x="510" y="115" width="260" height="80" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/>
  <text x="640" y="165" text-anchor="middle" font-family="Arial" font-size="25" font-weight="900" fill="#9a3412">Forward(row_length)</text>
  <rect x="510" y="235" width="260" height="80" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/>
  <text x="640" y="285" text-anchor="middle" font-family="Arial" font-size="25" font-weight="900" fill="#9a3412">Back(row_length)</text>
  <rect x="510" y="355" width="260" height="80" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="4"/>
  <text x="640" y="405" text-anchor="middle" font-family="Arial" font-size="25" font-weight="900" fill="#9a3412">Loop uses value</text>
  <path d="M390 245 C450 245 450 155 510 155 M390 245 C450 245 450 275 510 275 M390 245 C450 245 450 395 510 395" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  <text x="450" y="505" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#0f172a">אנלוגיה: כמו כפתור ווליום — משנים במקום אחד, וכל המערכת מגיבה</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">טיסת בכורה מחקרית</title><desc id="desc">ריחוף, מדידת סחיפה והקטנת scan_distance</desc><rect width="960" height="540" rx="32" fill="#eef7ff"/><rect x="70" y="75" width="480" height="350" rx="24" fill="#fff" stroke="#0ea5e9" stroke-width="6" stroke-dasharray="16 12"/><text x="310" y="55" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#075985">Safe Fly Zone</text><circle cx="310" cy="250" r="48" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><text x="310" y="258" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1e3a8a">Tello</text><path d="M310 250 m -120 0 h240" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/><text x="310" y="340" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#0f172a">Takeoff → Hover 15s → Yaw ↔ → Land</text><text x="310" y="390" text-anchor="middle" font-family="Arial" font-size="21" fill="#334155">מודדים סחיפה בס״מ</text><g font-family="Arial" fill="#0f172a"><text x="620" y="120" font-size="28" font-weight="700">משימה 2: Scale Down</text><rect x="620" y="155" width="250" height="70" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="745" y="198" text-anchor="middle" font-size="24" font-weight="700">scan_distance = 60in</text><path d="M745 230 v55" stroke="#0f172a" stroke-width="5" marker-end="url(#a)"/><rect x="620" y="300" width="250" height="70" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="745" y="343" text-anchor="middle" font-size="24" font-weight="700">scan_distance = 30in</text><text x="620" y="430" font-size="24" font-weight="700">לפני Run: Land / Abort מוכן</text></g><defs><marker id="a" markerWidth="12" markerHeight="12" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/></marker></defs></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Tello Mars Exploration</title><desc id="desc">תרשים סימולטור מאדים עם בסיס, גבעת סלעים, פאנל סולארי, סייסמוגרפים וסערת חול שמשנה מרחקים.</desc>
<defs><linearGradient id="mars" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fed7aa"/><stop offset="1" stop-color="#fb923c"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#7c2d12"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7c2d12" flood-opacity=".22"/></filter></defs>
<rect width="1200" height="720" rx="42" fill="url(#mars)"/><circle cx="980" cy="105" r="54" fill="#fde68a" opacity=".85"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#431407">Mars Exploration — מצילים את מושבת מאדים</text><text x="600" y="96" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#7c2d12">אין שלט בזמן אמת: Latency מחייב קוד אוטונומי מתוכנן מראש</text>
<rect x="70" y="120" width="1060" height="500" rx="32" fill="#fff7ed" stroke="#9a3412" stroke-width="6" stroke-dasharray="16 12" filter="url(#shadow)"/>
<g font-family="Arial" text-anchor="middle" font-weight="800"><rect x="870" y="470" width="175" height="86" rx="18" fill="#fee2e2" stroke="#b45309" stroke-width="5"/><text x="957" y="508" font-size="22" fill="#7c2d12">מנחת בסיס</text><text x="957" y="536" font-size="17" fill="#7c2d12">H</text><path d="M520 455 L610 255 L710 455 Z" fill="#c2410c" opacity=".85"/><path d="M560 455 L635 295 L685 455 Z" fill="#fed7aa" opacity=".5"/><text x="615" y="486" font-size="21" fill="#7c2d12">גבעת סלעים 100in</text><rect x="245" y="420" width="190" height="92" rx="12" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="5"/><line x1="265" y1="435" x2="415" y2="497" stroke="#60a5fa" stroke-width="5"/><line x1="415" y1="435" x2="265" y2="497" stroke="#60a5fa" stroke-width="5"/><text x="340" y="548" font-size="20" fill="#1e3a8a">פאנל סולארי</text><text x="340" y="575" font-size="17" fill="#1e3a8a">Yaw 360° לניקוי אבק</text></g>
<path d="M870 510 C760 470,760 250,630 235 S405 295,345 420" fill="none" stroke="#7c2d12" stroke-width="13" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M350 420 C485 535,705 570,880 535" fill="none" stroke="#16a34a" stroke-width="10" stroke-linecap="round" stroke-dasharray="20 15" marker-end="url(#arrow)"/>
<g font-family="Arial" text-anchor="middle" font-weight="900"><circle cx="210" cy="230" r="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="5"/><text x="210" y="238" font-size="20" fill="#075985">S1</text><circle cx="340" cy="225" r="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="5"/><text x="340" y="233" font-size="20" fill="#075985">S2</text><circle cx="470" cy="230" r="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="5"/><text x="470" y="238" font-size="20" fill="#075985">S3</text><text x="340" y="180" font-size="21" fill="#075985">סייסמוגרפים — Hover 4 sec בכל נקודה</text></g>
<path d="M120 355 C260 320,355 350,500 330" fill="none" stroke="#fef3c7" stroke-width="32" stroke-linecap="round" opacity=".7"/><text x="290" y="337" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#92400e">סערת חול: distance +50in</text>
<g font-family="Arial"><rect x="775" y="170" width="315" height="175" rx="22" fill="#fff" stroke="#fed7aa" stroke-width="4"/><text x="1064" y="210" text-anchor="end" font-size="24" font-weight="900" fill="#7c2d12">מדע המשימה</text><text x="1064" y="248" text-anchor="end" font-size="18" fill="#172033">כבידה: 38% מכדור הארץ</text><text x="1064" y="278" text-anchor="end" font-size="18" fill="#172033">אטמוספירה: ~1%</text><text x="1064" y="308" text-anchor="end" font-size="18" fill="#172033">Latency: 4–24 דקות</text><rect x="90" y="450" width="330" height="128" rx="22" fill="#fffbeb" stroke="#facc15" stroke-width="4"/><text x="395" y="490" text-anchor="end" font-size="23" font-weight="900" fill="#854d0e">כלי קוד</text><text x="395" y="526" text-anchor="end" font-size="18" fill="#172033">flight_height = 60/120in</text><text x="395" y="556" text-anchor="end" font-size="18" fill="#172033">Loop + Variable חוסכים אנרגיה</text></g>
<text x="600" y="674" text-anchor="middle" font-family="Arial" font-size="23" font-weight="900" fill="#7c2d12">בסימולטור מאדים: Reset הוא מעבדה בטוחה לדיבוג, לא קיצור דרך</text></svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Visual Calibration JPL</title><desc id="desc">תרשים כיול חזותי פיזי: מנחת המראה, שלוש תחנות A B C בגבהים שונים, Wait לפני צילום ופענוח JPL.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#f0fdf4"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".16"/></filter></defs>
<rect width="1200" height="720" rx="42" fill="url(#bg)"/><text x="600" y="54" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#172033">JPL Visual Calibration — פענוח חזותי וכיול שטח</text><text x="600" y="94" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#0f766e">Wait 2 sec לפני צילום: חדות היא נתון חקרי</text>
<rect x="70" y="120" width="1060" height="500" rx="32" fill="#fff" stroke="#22c55e" stroke-width="7" stroke-dasharray="18 14" filter="url(#shadow)"/><text x="600" y="152" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#166534">Safe Fly Zone — אין כניסה בזמן טיסה, Observer אחראי Abort</text>
<g font-family="Arial" text-anchor="middle" font-weight="800"><rect x="870" y="490" width="180" height="82" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><text x="960" y="526" font-size="22" fill="#166534">מנחת</text><text x="960" y="552" font-size="16" fill="#166534">המראה/נחיתה</text><rect x="630" y="400" width="155" height="110" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><text x="707" y="438" font-size="22" fill="#1e40af">תחנה A</text><text x="707" y="468" font-size="18" fill="#1e40af">80 ס״מ</text><text x="707" y="496" font-size="24" fill="#1e40af">J</text><rect x="410" y="450" width="145" height="70" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="5"/><text x="482" y="480" font-size="22" fill="#075985">תחנה B</text><text x="482" y="508" font-size="24" fill="#075985">P</text><rect x="245" y="245" width="160" height="215" rx="14" fill="#fde68a" stroke="#ca8a04" stroke-width="5"/><text x="325" y="325" font-size="22" fill="#854d0e">תחנה C</text><text x="325" y="356" font-size="18" fill="#854d0e">120 ס״מ</text><text x="325" y="390" font-size="24" fill="#854d0e">L</text></g>
<path d="M870 530 C810 495,770 455,785 455 S620 455,555 485 S438 430,405 350" fill="none" stroke="#0f766e" stroke-width="13" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M395 350 C510 585,760 585,880 548" fill="none" stroke="#16a34a" stroke-width="9" stroke-linecap="round" stroke-dasharray="20 15" marker-end="url(#arrow)"/>
<g font-family="Arial"><rect x="780" y="180" width="310" height="175" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/><text x="1064" y="220" text-anchor="end" font-size="24" font-weight="900" fill="#172033">צילום חד</text><text x="1064" y="258" text-anchor="end" font-size="18" fill="#172033">Move → Wait 2 sec</text><text x="1064" y="288" text-anchor="end" font-size="18" fill="#172033">Take Photo → Decode</text><text x="1064" y="318" text-anchor="end" font-size="18" fill="#172033">מילה סודית: J-P-L</text><rect x="105" y="455" width="300" height="115" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="4"/><text x="380" y="494" text-anchor="end" font-size="23" font-weight="900" fill="#c2410c">כיול</text><text x="380" y="530" text-anchor="end" font-size="18" fill="#172033">scan_height / distance</text><text x="380" y="558" text-anchor="end" font-size="18" fill="#172033">שינוי אחד בכל סבב</text></g>
<text x="600" y="674" text-anchor="middle" font-family="Arial" font-size="23" font-weight="900" fill="#0f766e">תמונה מטושטשת אינה “בעיה במצלמה” — היא סימן שצריך Wait/כיול/תאורה</text></svg>
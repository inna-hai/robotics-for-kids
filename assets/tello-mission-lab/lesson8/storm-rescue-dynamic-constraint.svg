<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">מבצע חילוץ בעין הסערה</title><desc id="desc">תרשים אזור טיסה בטוח עם מנחת, שתי תחנות A ו-B, מנהרת רוח אסורה ומיקום חדש לתחנה B.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/></marker><marker id="redarrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#dc2626"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".16"/></filter></defs>
<rect width="1200" height="720" rx="42" fill="url(#bg)"/><text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#172033">מבצע חילוץ בעין הסערה — מחשבים מסלול מחדש</text><text x="600" y="92" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0369a1">Fallback Route תחת לחץ זמן: Set Speed 60%, Hover לצילום, Share Link בסוף</text>
<rect x="70" y="120" width="1060" height="500" rx="32" fill="#fff" stroke="#22c55e" stroke-width="7" stroke-dasharray="18 14" filter="url(#shadow)"/><text x="600" y="152" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#166534">Safe Fly Zone — 2.5m, צוות אחד באוויר, Observer אחראי Abort</text>
<g font-family="Arial" text-anchor="middle" font-weight="800"><rect x="880" y="470" width="180" height="88" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><text x="970" y="510" font-size="23" fill="#166534">מנחת בית</text><text x="970" y="538" font-size="17" fill="#166534">Takeoff / Land</text>
<rect x="635" y="455" width="135" height="82" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><text x="702" y="498" font-size="30" fill="#1e40af">A</text><text x="702" y="526" font-size="16" fill="#1e40af">סימני חיים</text>
<rect x="245" y="455" width="135" height="82" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="5"/><text x="312" y="498" font-size="30" fill="#92400e">B</text><text x="312" y="526" font-size="16" fill="#92400e">מיקום חדש</text>
<rect x="390" y="455" width="110" height="82" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8"/><text x="445" y="498" font-size="24" fill="#991b1b">B ישן</text></g>
<path d="M880 510 C795 500,785 488,770 495 S725 508,770 495" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M635 495 C535 380,410 375,315 455" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-dasharray="24 15" marker-end="url(#arrow)"/><path d="M445 495 L330 495" stroke="#dc2626" stroke-width="9" stroke-linecap="round" marker-end="url(#redarrow)"/>
<g font-family="Arial" text-anchor="middle" font-weight="800"><polygon points="690,250 735,330 645,330" fill="#fb923c" stroke="#c2410c" stroke-width="5"/><text x="690" y="360" font-size="19" fill="#9a3412">קונוס 1</text><polygon points="500,250 545,330 455,330" fill="#fb923c" stroke="#c2410c" stroke-width="5"/><text x="500" y="360" font-size="19" fill="#9a3412">קונוס 2</text></g>
<rect x="515" y="245" width="160" height="80" rx="20" fill="#bae6fd" stroke="#0284c7" stroke-width="5" opacity=".92"/><text x="595" y="278" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#075985">מנהרת רוח</text><text x="595" y="305" text-anchor="middle" font-family="Arial" font-size="17" fill="#075985">אזור אסור</text>
<g font-family="Arial"><rect x="785" y="185" width="300" height="175" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/><text x="1060" y="225" text-anchor="end" font-size="24" font-weight="900" fill="#172033">עדכון חירום</text><text x="1060" y="263" text-anchor="end" font-size="18" fill="#172033">B זזה 40 ס״מ ימינה</text><text x="1060" y="293" text-anchor="end" font-size="18" fill="#172033">אין טיסה במנהרת הרוח</text><text x="1060" y="323" text-anchor="end" font-size="18" fill="#172033">10 דקות לתיקון קוד</text><rect x="95" y="170" width="315" height="160" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="4"/><text x="382" y="210" text-anchor="end" font-size="24" font-weight="900" fill="#c2410c">כללי פתרון</text><text x="382" y="248" text-anchor="end" font-size="18" fill="#172033">שינוי פרמטר אחד</text><text x="382" y="278" text-anchor="end" font-size="18" fill="#172033">Comment לכל קטע קוד</text><text x="382" y="308" text-anchor="end" font-size="18" fill="#172033">Abort לפני סיכון</text></g>
<text x="600" y="674" text-anchor="middle" font-family="Arial" font-size="23" font-weight="900" fill="#0f766e">כיתה ו׳: לא רק להטיס — לנהל החלטה תחת אילוץ, סוללה וזמן</text></svg>
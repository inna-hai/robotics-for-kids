<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">City Mapping Blueprint</title><desc id="desc">תרשים Blueprint למיפוי עיר עתיד: מנחת בית, בניין נמוך, בניין יעד, סריקה מרובעת בלולאה ומשתנה scan_height.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#ecfeff"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".16"/></filter></defs>
<rect width="1200" height="720" rx="42" fill="url(#bg)"/><text x="600" y="54" text-anchor="middle" font-family="Arial" font-size="34" font-weight="900" fill="#172033">Tello Mission Lab Blueprint — מיפוי עיר העתיד</text><text x="600" y="94" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#1d4ed8">פוטוגרמטריה: סריקה שיטתית, תמונות חופפות וגובה מדויק</text>
<rect x="70" y="118" width="1060" height="510" rx="32" fill="#fff" stroke="#2563eb" stroke-width="7" stroke-dasharray="18 14" filter="url(#shadow)"/>
<g font-family="Arial" text-anchor="middle" font-weight="800"><rect x="860" y="485" width="185" height="86" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/><text x="952" y="522" font-size="22" fill="#166534">מנחת בית</text><text x="952" y="550" font-size="17" fill="#166534">Takeoff / Land</text><rect x="650" y="395" width="170" height="115" rx="10" fill="#cbd5e1" stroke="#475569" stroke-width="5"/><text x="735" y="448" font-size="20" fill="#334155">בניין נמוך</text><text x="735" y="476" font-size="16" fill="#334155">עקיפה</text><rect x="270" y="235" width="235" height="255" rx="12" fill="#93c5fd" stroke="#1d4ed8" stroke-width="5"/><rect x="302" y="265" width="170" height="105" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="4"/><text x="387" y="320" font-size="22" fill="#1e40af">גג יעד</text><text x="387" y="520" font-size="19" fill="#1e40af">בניין גבוה</text></g>
<path d="M860 525 C780 510,760 455,735 450 S580 380,505 350" fill="none" stroke="#2563eb" stroke-width="13" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="292" y="255" width="190" height="135" rx="18" fill="none" stroke="#0f766e" stroke-width="10" stroke-dasharray="24 14"/><path d="M482 255 L482 390 L292 390 L292 255 L482 255" fill="none" stroke="#0f766e" stroke-width="8" marker-end="url(#arrow)"/>
<g font-family="Arial"><rect x="775" y="160" width="315" height="190" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="4"/><text x="1064" y="200" text-anchor="end" font-size="24" font-weight="900" fill="#c2410c">דרישות חובה</text><text x="1064" y="238" text-anchor="end" font-size="18" fill="#172033">scan_height בראש הקוד</text><text x="1064" y="268" text-anchor="end" font-size="18" fill="#172033">Loop ×4 לסריקת גג</text><text x="1064" y="298" text-anchor="end" font-size="18" fill="#172033">Hover 2 sec בפינות</text><text x="1064" y="328" text-anchor="end" font-size="18" fill="#172033">Share Link: City_Mapping</text><rect x="105" y="165" width="310" height="130" rx="22" fill="#eef2ff" stroke="#c7d2fe" stroke-width="4"/><text x="390" y="205" text-anchor="end" font-size="23" font-weight="900" fill="#3730a3">Blueprint לפני קוד</text><text x="390" y="242" text-anchor="end" font-size="18" fill="#172033">גובה בניינים</text><text x="390" y="272" text-anchor="end" font-size="18" fill="#172033">מרחקים + Yaw</text></g>
<text x="600" y="674" text-anchor="middle" font-family="Arial" font-size="23" font-weight="900" fill="#1d4ed8">צוות שמציג שרטוט ברור מקבל “אור ירוק” לפתיחת הטאבלט</text></svg>
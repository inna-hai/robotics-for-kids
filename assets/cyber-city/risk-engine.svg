<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Password Safety Checker</title>
  <desc id="desc">A clean cyber education illustration showing a demo password checker, safe code reminder, and risk output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="920" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="102" cy="88" r="64" fill="#dbeafe"/>
  <circle cx="820" cy="430" r="86" fill="#dcfce7"/>
  <rect x="72" y="62" width="776" height="396" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="4"/>

  <g transform="translate(108 104)">
    <rect width="356" height="230" rx="22" fill="url(#screen)"/>
    <circle cx="32" cy="32" r="8" fill="#ef4444"/>
    <circle cx="58" cy="32" r="8" fill="#f59e0b"/>
    <circle cx="84" cy="32" r="8" fill="#22c55e"/>
    <text x="30" y="78" fill="#93c5fd" font-family="Consolas, monospace" font-size="22">pwd = "demo123"</text>
    <text x="30" y="116" fill="#e2e8f0" font-family="Consolas, monospace" font-size="22">risk = 0</text>
    <text x="30" y="154" fill="#e2e8f0" font-family="Consolas, monospace" font-size="22">if len(pwd) &lt; 8:</text>
    <text x="62" y="192" fill="#bbf7d0" font-family="Consolas, monospace" font-size="22">risk += 30</text>
  </g>

  <g transform="translate(514 96)">
    <rect width="260" height="58" rx="18" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="3"/>
    <text x="28" y="37" fill="#047857" font-family="Arial, sans-serif" font-size="20" font-weight="800">DEMO PASSWORD ONLY</text>
  </g>
  <g transform="translate(514 174)">
    <rect width="260" height="58" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="44" y="37" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="20" font-weight="800">DO NOT SHARE CODE</text>
  </g>
  <g transform="translate(514 252)">
    <rect width="260" height="58" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
    <text x="64" y="37" fill="#c2410c" font-family="Arial, sans-serif" font-size="20" font-weight="800">CHECK BEFORE LOGIN</text>
  </g>

  <path d="M464 190 C496 190 488 126 514 126" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <path d="M464 210 C494 210 488 202 514 202" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <path d="M464 232 C500 232 488 280 514 280" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(126 366)">
    <text x="0" y="0" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="900">Password Lab</text>
    <text x="0" y="34" fill="#475569" font-family="Arial, sans-serif" font-size="18">demo password · check risk · safe action</text>
  </g>
  <g transform="translate(514 368)">
    <rect width="260" height="34" rx="17" fill="#e2e8f0"/>
    <rect width="172" height="34" rx="17" fill="url(#meter)"/>
    <text x="24" y="25" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="900">Risk check</text>
  </g>
</svg>

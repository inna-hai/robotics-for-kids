<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Python Risk Engine</title>
  <desc id="desc">A clean cyber education illustration showing a Python console, risk signals, and a scanner output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="920" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="780" cy="86" r="74" fill="#dbeafe"/>
  <circle cx="116" cy="424" r="92" fill="#dcfce7"/>
  <rect x="74" y="70" width="772" height="380" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="4"/>
  <rect x="110" y="106" width="444" height="294" rx="20" fill="url(#screen)"/>
  <circle cx="140" cy="134" r="8" fill="#ef4444"/>
  <circle cx="166" cy="134" r="8" fill="#f59e0b"/>
  <circle cx="192" cy="134" r="8" fill="#22c55e"/>
  <text x="132" y="182" fill="#93c5fd" font-family="Consolas, monospace" font-size="24">risk = 0</text>
  <text x="132" y="224" fill="#e2e8f0" font-family="Consolas, monospace" font-size="24">if suspicious_domain:</text>
  <text x="164" y="264" fill="#bbf7d0" font-family="Consolas, monospace" font-size="24">risk += 30</text>
  <text x="132" y="306" fill="#e2e8f0" font-family="Consolas, monospace" font-size="24">if asks_otp:</text>
  <text x="164" y="346" fill="#bbf7d0" font-family="Consolas, monospace" font-size="24">risk += 40</text>
  <text x="132" y="386" fill="#fef3c7" font-family="Consolas, monospace" font-size="23">print("Report")</text>
  <g transform="translate(600 118)">
    <rect width="198" height="60" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
    <text x="24" y="39" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="20" font-weight="700">DOMAIN +30</text>
  </g>
  <g transform="translate(600 202)">
    <rect width="198" height="60" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
    <text x="28" y="39" fill="#c2410c" font-family="Arial, sans-serif" font-size="20" font-weight="700">TIMER +20</text>
  </g>
  <g transform="translate(600 286)">
    <rect width="198" height="60" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="3"/>
    <text x="46" y="39" fill="#b91c1c" font-family="Arial, sans-serif" font-size="20" font-weight="700">OTP +40</text>
  </g>
  <path d="M554 198 C584 198 584 148 600 148" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <path d="M554 272 C584 272 584 232 600 232" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/>
  <path d="M554 342 C584 342 584 316 600 316" fill="none" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
  <rect x="606" y="382" width="190" height="32" rx="16" fill="#fee2e2"/>
  <rect x="606" y="382" width="146" height="32" rx="16" fill="#ef4444"/>
  <text x="622" y="407" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="800">Risk 90%</text>
</svg>

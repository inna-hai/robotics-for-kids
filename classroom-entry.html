<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כניסה ללומדה | hai.tech</title>
  <meta name="description" content="בחירה בין התנסות כאורח, מנוי אישי וכניסה כתלמיד/ה בכיתה.">
  <link rel="stylesheet" href="css/classroom-platform.css">
</head>
<body data-classroom-page="entry">
  <header class="topbar">
    <a class="brand" href="index.html">🌈 hai.tech</a>
    <span class="topbar-note">כניסה לפי משתמש והרשאה</span>
  </header>

  <main class="login-shell">
    <section class="card login-card" aria-labelledby="unifiedLoginTitle">
      <div class="login-brand">
        <span>hai.tech</span>
        <i aria-hidden="true"></i>
      </div>
      <h1 id="unifiedLoginTitle">נכנסים ללומדה</h1>
      <p class="login-subtitle">מורים ותלמידים נכנסים מאותו מקום. ההרשאה נקבעת אוטומטית לפי המשתמש.</p>
      <form id="classroom-unified-login-form">
        <label>שם משתמש או מייל מורה
          <input name="username" autocomplete="username" required>
        </label>
        <label>סיסמה
          <span class="password-wrap">
            <input id="classroom-unified-password" name="password" type="password" autocomplete="current-password" required>
            <button class="password-toggle" type="button" data-toggle-password="classroom-unified-password" aria-label="הצגת סיסמה"><span class="eye-icon" aria-hidden="true"></span></button>
          </span>
        </label>
        <button class="button primary" type="submit">כניסה</button>
      </form>
      <p class="message" id="classroom-unified-message" aria-live="polite"></p>

      <div class="login-actions">
        <button class="text-button" type="button" data-toggle-recovery="student-code-request">אין לי משתמש / שכחתי קוד</button>
        <a class="text-button" href="teacher-classrooms.html">הרשמת מורה חדשה</a>
        <a class="text-button" href="teacher-classrooms.html">שכחתי סיסמה</a>
      </div>

      <form class="recovery-form request-teacher-form" id="student-code-request" hidden>
        <p>תלמיד/ה בלי פרטי כניסה מבקש/ת מהמורה ליצור או לשלוח משתמש. אי אפשר לפתוח משתמש תלמיד לבד.</p>
        <label>קוד כיתה
          <input name="classCode" inputmode="text" autocomplete="organization" maxlength="6" required>
        </label>
        <label>שם תלמיד/ה
          <input name="studentName" autocomplete="name" required>
        </label>
        <button class="button quiet" type="submit">שליחת בקשה למורה</button>
      </form>
      <p class="message" id="student-login-message" aria-live="polite"></p>

      <div class="signed-in" id="student-session" hidden>
        <strong id="student-welcome"></strong>
        <p>הלומדות הפתוחות לכיתה שלך:</p>
        <div class="course-links" id="student-course-links"></div>
        <a class="button primary" id="student-continue" href="index.html" hidden>להמשיך ללומדה</a>
        <button class="button quiet" id="student-logout" type="button">החלפת תלמיד/ה</button>
      </div>
    </section>
  </main>

  <script src="js/classroom-platform.js?v=20260915-hadasa-structured-sync-1"></script>
  <script src="/js/feedback-widget.js?v=20260907-tehila-fixes-1"></script>
</body>
</html>

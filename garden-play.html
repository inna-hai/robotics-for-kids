<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">🥕 משימת הערוגות</title>
  <meta name="description" content="משחק שיעור 10: מטפלים בערוגות ירקות בעזרת כלים קבועים ובוחרים את הכלי שמתאים לסימנים בגינה." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/garden.css?v=20260817-vegetable-game">
</head>
<body>
  <main class="shell">
    <header class="play-header">
      <div><div class="kicker" id="page-subtitle">שיעור 10 • משימת הערוגות</div><h1>🥕 משימת הערוגות</h1></div>
      <nav class="lesson-nav" id="lesson-nav" aria-label="מעבר בין ערוגות הגינה"></nav>
    </header>

    <section class="stage-card">
      <div class="big-emoji" id="lesson-emoji" aria-hidden="true">🌱</div>
      <div><h2 id="lesson-heading">שלב בגינה</h2><p id="story"></p><span class="stage-chip" id="stage"></span><div class="learning-note" id="learning-note"></div></div>
    </section>

    <section class="garden-layout">
      <div class="action-panel">
        <h2>מחסן הכלים הקבוע</h2>
        <p>הכלים נשארים קבועים בכל הערוגות. בכל תרגיל צריך לזהות את מצב הירק ולהשתמש בכלי אחר שמתאים לסימנים.</p>
        <div class="action-grid" id="action-options"></div>
      </div>
      <div class="choice-panel">
        <div class="score-pill" id="garden-score" aria-live="polite"></div>
        <h2>לוח הערוגה</h2>
        <div class="garden-board" id="garden-board" aria-live="polite"></div>
        <h2>הבחירה שלי</h2>
        <div class="choice-preview" id="choice-preview" aria-live="polite"></div>
        <h2>משימת הערוגות</h2>
        <div class="growth-path" id="growth-path" aria-label="ערוגות הירקות"></div>
        <div class="controls">
          <button class="btn" id="check" type="button">✅ בדיקה</button>
          <button class="btn secondary" id="hint" type="button">💡 רמז</button>
          <button class="btn secondary" id="clear" type="button">🔁 לנסות שוב</button>
          <a class="btn secondary" href="sisi.html">🤖 לעמוד סיסי</a>
          <a class="btn secondary" href="park.html">🎡 לשיעור הבא</a>
        </div>
        <div class="result" id="result" aria-live="polite"></div>
        <div class="next-step" id="next-step"></div>
      </div>
    </section>
  </main>
  <script src="js/garden-lessons.js?v=20260817-vegetable-game"></script>
  <script src="js/course-certificate.js?v=20260817-merged-final-mission-stability"></script>
  <script src="js/garden-play.js?v=20260817-vegetable-game"></script>
  <script src="/js/feedback-widget.js?v=20260714-mobile-offset"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">✉️ סיסי בדואר הקסום</title>
  <meta name="description" content="משחק שיעור 12: קוראים רמזים ושולחים הודעה ליעד המתאים." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mail.css?v=20260816-learning-notes-routing">
</head>
<body>
  <main class="shell">
    <header class="play-header">
      <div><div class="kicker" id="page-subtitle">שיעור 12 • ניתוב לפי רמזים</div><h1>✉️ סיסי בדואר הקסום</h1></div>
      <nav class="lesson-nav" id="lesson-nav" aria-label="מעבר בין הודעות הדואר"></nav>
    </header>

    <section class="message-card">
      <div class="big-emoji" id="lesson-emoji" aria-hidden="true">✉️</div>
      <div><h2 id="lesson-heading">הודעת דואר</h2><p id="message"></p><span class="clue-chip" id="clue-chip"></span><div class="learning-note" id="learning-note"></div></div>
    </section>

    <section class="mail-layout">
      <div class="route-panel">
        <h2>לאיזו תיבה שולחים?</h2>
        <p>קראו את ההודעה, הסתכלו על הרמזים שעל כל תיבה, ואז הוליכו את המעטפה ליעד המתאים.</p>
        <div class="route-grid" id="route-options"></div>
      </div>
      <div class="preview-panel">
        <h2>הניתוב שלי</h2>
        <div class="route-preview" id="route-preview" aria-live="polite"></div>
        <div class="mail-game" aria-label="משחק הולכת מעטפה במבוך">
          <div class="mail-game-hint">הוליכו את המעטפה עם החיצים אל תיבת הדואר המתאימה.</div>
          <div class="mail-maze" id="mail-maze" aria-label="לוח מבוך דואר"></div>
          <div class="maze-controls" aria-label="חיצי תנועה למעטפה">
            <button class="maze-btn" data-move="up" type="button">⬆️</button>
            <button class="maze-btn" data-move="right" type="button">➡️</button>
            <button class="maze-btn" data-move="left" type="button">⬅️</button>
            <button class="maze-btn" data-move="down" type="button">⬇️</button>
          </div>
        </div>
        <div class="controls">
          <button class="btn" id="check" type="button">✅ בדיקה</button>
          <button class="btn secondary" id="hint" type="button">💡 רמז</button>
          <button class="btn secondary" id="clear" type="button">🔁 לנסות שוב</button>
          <a class="btn secondary" href="sisi.html">🤖 לעמוד סיסי</a>
          <a class="btn secondary" href="cinema.html">🎬 לשיעור הבא</a>
        </div>
        <div class="result" id="result" aria-live="polite"></div>
        <div class="next-step" id="next-step"></div>
      </div>
    </section>
  </main>
  <script src="js/mail-lessons.js?v=20260816-learning-notes-routing"></script>
  <script src="js/course-certificate.js?v=20260816-finish-message-lessons-1-5-11-15-art"></script>
  <script src="js/mail-play.js?v=20260816-learning-notes-routing"></script>
  <script src="/js/feedback-widget.js?v=20260714-mobile-offset"></script>
</body>
</html>

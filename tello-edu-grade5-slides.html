<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מצגת מדריך — Tello EDU</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Rubik,Arial,sans-serif;direction:rtl;color:#0f172a;background:radial-gradient(circle at 12% 0,rgba(34,211,238,.24),transparent 30%),linear-gradient(135deg,#07111f,#123c69 58%,#0f766e);height:100vh;overflow:hidden}.deck{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 28px 96px}.slide{display:none;width:min(1160px,100%);min-height:min(690px,calc(100vh - 124px));background:rgba(255,255,255,.98);border-radius:34px;padding:42px;box-shadow:0 28px 82px rgba(0,0,0,.34);overflow:auto}.slide.active{display:flex;flex-direction:column;justify-content:center}.kicker{font-weight:900;color:#0e7490;margin-bottom:10px}.big-icon{font-size:4.4rem;margin-bottom:10px}h1{font-size:clamp(2.4rem,6vw,4.8rem);line-height:1.05;margin:0 0 16px}h2{font-size:clamp(2rem,5vw,3.55rem);line-height:1.1;margin:0 0 20px}p,li{font-size:clamp(1.08rem,1.8vw,1.36rem);line-height:1.62}.lead{font-size:clamp(1.2rem,2.1vw,1.55rem);color:#334155}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#f8fafc;border-radius:18px;padding:16px;border-right:7px solid #22d3ee;line-height:1.55}.card b{display:block;color:#0e7490;font-size:1.12rem}.three{grid-template-columns:repeat(3,1fr)}.note{background:#ecfeff;border-right:7px solid #0e7490;border-radius:18px;padding:16px;margin-top:14px}.warning{background:#fff7ed;border-right-color:#f97316}.mission{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;direction:ltr;text-align:left;background:#0f172a;color:#e0f2fe;border-radius:22px;padding:20px;font-size:clamp(1.15rem,2vw,1.65rem);line-height:1.8}.screenshot{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:18px;align-items:center}.shot{background:#0f172a;border-radius:22px;padding:12px;min-height:340px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.shot img{max-width:100%;max-height:58vh;border-radius:14px;object-fit:contain}.nav{position:fixed;inset:auto 24px 24px 24px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;color:white;font-weight:900;pointer-events:none}.nav>*{pointer-events:auto}button,.back{border:0;border-radius:999px;background:white;color:#0e7490;padding:12px 18px;font-weight:900;text-decoration:none;cursor:pointer;font-family:inherit}.counter{background:rgba(0,0,0,.25);padding:10px 16px;border-radius:999px;justify-self:center}@media(max-width:780px){body{overflow:auto}.deck{height:auto;min-height:100svh;padding:12px 10px 92px}.slide{min-height:calc(100svh - 110px);padding:22px 16px;border-radius:22px}.cards,.three,.screenshot{grid-template-columns:1fr}.shot{min-height:220px}.nav{inset:auto 10px 10px 10px;display:flex;justify-content:space-between}.counter{display:none}button,.back{padding:10px 12px;font-size:.9rem}}
  </style>
</head>
<body>
  <!-- Static QA markers: Pitch, Roll ו־Yaw · רחפנים בעולם האמיתי · בטיחות לפני טיסה · Lenovo TB311FU -->
  <main class="deck" id="deck"></main>
  <nav class="nav"><button onclick="prevSlide()">→ הקודם</button><span class="counter" id="counter"></span><div><button onclick="nextSlide()">הבא ←</button> <a class="back" id="playLink" href="tello-edu-grade5-play.html?lesson=1">ללומדה</a> <a class="back" id="guideLink" href="tello-edu-grade5-guide.html?lesson=1">מערך מדריך</a> <a class="back" href="tello-edu-grade5.html">לקורס</a></div></nav>
  <script src="js/tello-edu-grade5-lessons.js?v=20260823-grade5-model-1"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const lesson = window.getTelloEduGrade5Lesson(params.get('lesson'));
    const labels = window.TELLO_EDU_GRADE5_BLOCK_LABELS || {};
    const missionLines = (lesson.blocks || []).map((b,i) => `${i+1}. ${labels[b] || b}`).join('\n');
    const esc = v => String(v || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    document.title = `מצגת מדריך — ${lesson.title}`;
    document.getElementById('playLink').href = `tello-edu-grade5-play.html?lesson=${lesson.id}`;
    document.getElementById('guideLink').href = `tello-edu-grade5-guide.html?lesson=${lesson.id}`;
    const realCards = (lesson.realWorldUses || []).map(u => `<div class="card"><b>${esc(u.icon)} ${esc(u.title)}</b>${esc(u.text)}</div>`).join('');
    const safetyCards = (lesson.safetyRules || []).slice(0,4).map(rule => `<div class="card">🛡️ ${esc(rule)}</div>`).join('');
    const criteriaCards = (lesson.successCriteria || []).map(item => `<div class="card">✅ ${esc(item)}</div>`).join('');
    const slideCards = (lesson.instructorSlides || []).map(slide => ({ html: `<div class="kicker">${esc(lesson.title)}</div><h2>${esc(slide.title)}</h2><p class="lead">${esc(slide.body)}</p><div class="cards three">${(slide.bullets || []).map(b => `<div class="card">${esc(b)}</div>`).join('')}</div>` }));
    const screenshotCards = (lesson.screenshotSlides || []).map(shot => ({ html: `<div class="kicker">צילום מסך מהאפליקציה</div><h2>${esc(shot.title)}</h2><div class="screenshot"><div class="shot"><img src="${esc(shot.src)}" alt="${esc(shot.title)}"></div><div class="card"><b>מה בודקים?</b>${esc(shot.caption)}</div></div>` }));
    const setupCards = (lesson.setupSteps || []).map((step,i)=>`<div class="card"><b>${i+1}</b>${esc(step)}</div>`).join('');
    const slides = [
      { html: `<div class="big-icon">🚁📱</div><div class="kicker">Tello EDU · כיתה ה׳ · שיעור ${lesson.id}</div><h1>${esc(lesson.title)}</h1><p class="lead">${esc(lesson.subtitle || lesson.story)}</p><div class="note"><b>${lesson.physicalFlightAllowed ? 'טיסה פיזית רק באישור מדריך' : 'סימולטור בלבד'}</b> · דיוק הנדסי מתחיל לפני שהמדחפים מסתובבים.</div>` },
      { html: `<div class="kicker">שאלת משימה</div><h2>${esc(lesson.essentialQuestion || lesson.concept)}</h2><p class="lead">${esc(lesson.story)}</p><div class="note"><b>משימת היום:</b> ${esc(lesson.mission)}</div>` },
      { html: `<div class="kicker">למה זה חשוב?</div><h2>רחפנים בעולם האמיתי</h2><div class="cards">${realCards}</div>` },
      { html: `<div class="kicker">מטרות הצלחה</div><h2>בסוף השיעור נוכל לומר:</h2><div class="cards">${criteriaCards}</div>` },
      { html: `<div class="kicker">בטיחות לפני טיסה</div><h2>הרחפן קטן — האחריות גדולה</h2><div class="cards">${safetyCards}</div>` },
      ...slideCards,
      ...screenshotCards,
      { html: `<div class="kicker">רצף בלוקים</div><h2>תוכנית הטיסה</h2><div class="mission">${esc(missionLines)}</div><div class="note"><b>כלל זהב:</b> סדר הפקודות הוא חלק מהבטיחות.</div>` },
      { html: `<div class="kicker">עבודה בטאבלטים</div><h2>פותחים, בונים, מריצים, בודקים</h2><div class="cards">${setupCards}</div>` },
      { html: `<div class="kicker">תוצר סיום</div><h2>${esc(lesson.deliverable || 'תוכנית טיסה עובדת + כרטיס יציאה')}</h2><p class="lead">הקוד הוא תוכנית הטיסה. אם אי אפשר להסביר אותו — עוד לא סיימנו לבדוק אותו.</p><div class="note"><b>כרטיס יציאה:</b> ${esc((lesson.instructorGuide && lesson.instructorGuide.exitTicket) || 'רחפן צריך תוכנית מדויקת כי...')}</div>` }
    ];
    let current = 0;
    document.getElementById('deck').innerHTML = slides.map((s,i)=>`<section class="slide ${i?'':'active'}">${s.html}</section>`).join('');
    function render(){ document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('active',i===current)); document.getElementById('counter').textContent = `${current+1} / ${slides.length}`; }
    function nextSlide(){ current=Math.min(current+1,slides.length-1); render(); }
    function prevSlide(){ current=Math.max(current-1,0); render(); }
    document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key===' ')nextSlide(); if(e.key==='ArrowRight')prevSlide(); });
    render();
  </script>
  <script src="/js/feedback-widget.js?v=20260711-feedback"></script>
</body>
</html>
